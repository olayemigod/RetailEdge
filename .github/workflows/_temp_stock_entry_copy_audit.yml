name: Temporary stock entry copy patch

on:
  push:
    branches:
      - fix/stock-entry-production-copy-20261008
    paths:
      - .github/workflows/_temp_stock_entry_copy_audit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/stock-entry-production-copy-20261008
          fetch-depth: 0
      - name: Apply exact stock-entry copy replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files = {
              Path('retailedge/public/js/transfer_stock/TransferStock.vue'): [
                  (
                      '"ERPNext has submitted the Stock Entry and owns the posted stock movement."',
                      '"The Stock Entry has been submitted and the stock movement is posted."',
                      1,
                  ),
                  (
                      '"The ERPNext Stock Entry draft now owns the transfer."',
                      '"The Stock Entry draft now owns the transfer."',
                      1,
                  ),
                  (
                      'Serial-numbered or batch-managed items may require Advanced ERPNext review so exact serial/batch allocations remain authoritative.',
                      'Serial-numbered or batch-managed items may require advanced Stock Entry review so exact serial/batch allocations remain authoritative.',
                      1,
                  ),
                  (
                      'A temporary browser-session recovery copy is retained until the ERPNext draft is saved.',
                      'A temporary browser-session recovery copy is retained until the Stock Entry draft is saved.',
                      1,
                  ),
                  ('Advanced: ERPNext', 'Advanced: Open Stock Entry', 1),
                  (
                      'Open the saved Stock Entry in Advanced ERPNext? Unsaved page edits are not carried until you update the draft.',
                      'Open the saved Stock Entry in the advanced form? Unsaved page edits are not carried until you update the draft.',
                      1,
                  ),
                  (
                      'Open the advanced ERPNext Stock Entry form? Save this page first if you want the current transfer recorded.',
                      'Open the advanced Stock Entry form? Save this page first if you want the current transfer recorded.',
                      1,
                  ),
              ],
              Path('retailedge/public/js/stock_adjustment/StockAdjustment.vue'): [
                  (
                      '"ERPNext has submitted the Stock Reconciliation and owns the posted stock correction."',
                      '"The Stock Reconciliation has been submitted and the stock correction is posted."',
                      1,
                  ),
                  (
                      '"The ERPNext Stock Reconciliation draft now owns this stock count."',
                      '"The Stock Reconciliation draft now owns this stock count."',
                      1,
                  ),
                  (
                      'Valuation fields remain hidden. Serial-numbered or batch-managed items may require Advanced ERPNext review so stock truth is preserved.',
                      'Valuation fields remain hidden. Serial-numbered or batch-managed items may require advanced Stock Reconciliation review so stock truth is preserved.',
                      1,
                  ),
                  (
                      'A temporary browser-session recovery copy is retained until the ERPNext draft is saved.',
                      'A temporary browser-session recovery copy is retained until the Stock Reconciliation draft is saved.',
                      1,
                  ),
                  ('Advanced: ERPNext', 'Advanced: Open Stock Reconciliation', 1),
                  (
                      'Open the saved Stock Reconciliation in Advanced ERPNext? Unsaved page edits are not carried until you update the draft.',
                      'Open the saved Stock Reconciliation in the advanced form? Unsaved page edits are not carried until you update the draft.',
                      1,
                  ),
                  (
                      'Open the advanced ERPNext Stock Reconciliation form? Save this page first if you want the current count recorded.',
                      'Open the advanced Stock Reconciliation form? Save this page first if you want the current count recorded.',
                      1,
                  ),
              ],
          }

          for path, replacements in files.items():
              text = path.read_text(encoding='utf-8')
              for old, new, expected in replacements:
                  actual = text.count(old)
                  if actual != expected:
                      raise SystemExit(f'{path}: expected {expected} occurrence(s) of {old!r}, found {actual}')
                  text = text.replace(old, new)
              for forbidden in ('ERPNext', 'Frappe Workflow', 'Advanced: ERPNext'):
                  if forbidden in text:
                      hits = [f'{i}: {line}' for i, line in enumerate(text.splitlines(), 1) if forbidden in line]
                      raise SystemExit(f'{path}: unexpected {forbidden!r} remains:\n' + '\n'.join(hits))
              path.write_text(text, encoding='utf-8')

          transfer = Path('retailedge/public/js/transfer_stock/TransferStock.vue').read_text(encoding='utf-8')
          for contract in (
              'const CREATE_METHOD = "retailedge.guided_stock_transfer.create_simple_stock_transfer_draft";',
              'const UPDATE_METHOD = "retailedge.standard_stock_completion.update_standard_stock_document_draft";',
              'const PREVIEW_METHOD = "retailedge.standard_stock_completion.get_standard_stock_completion_preview";',
              'v-if="canUseNativeDesk"',
              '@click="openAdvancedNative"',
              'frappe.set_route("Form", "Stock Entry", this.savedDocument.name)',
              'frappe.new_doc("Stock Entry", { purpose: "Material Transfer" })',
              'sameWarehouse()',
              'transferContextReady()',
          ):
              if contract not in transfer:
                  raise SystemExit(f'Transfer Stock safety contract missing: {contract}')

          adjustment = Path('retailedge/public/js/stock_adjustment/StockAdjustment.vue').read_text(encoding='utf-8')
          for contract in (
              'const CREATE_METHOD = "retailedge.guided_stock_adjustment.create_simple_stock_adjustment_draft";',
              'const UPDATE_METHOD = "retailedge.standard_stock_completion.update_standard_stock_document_draft";',
              'const PREVIEW_METHOD = "retailedge.standard_stock_completion.get_standard_stock_completion_preview";',
              'v-if="canUseNativeDesk"',
              '@click="openAdvancedNative"',
              'frappe.set_route("Form", "Stock Reconciliation", this.savedDocument.name)',
              'frappe.new_doc("Stock Reconciliation")',
              'resolveBranchWarehouse',
          ):
              if contract not in adjustment:
                  raise SystemExit(f'Stock Adjustment safety contract missing: {contract}')

          test = Path('retailedge/tests/test_stock_entry_production_copy.py')
          test.write_text('''from __future__ import annotations\n\nfrom pathlib import Path\n\n\nROOT = Path(__file__).resolve().parents[1]\nTRANSFER = ROOT / "public/js/transfer_stock/TransferStock.vue"\nADJUSTMENT = ROOT / "public/js/stock_adjustment/StockAdjustment.vue"\n\n\ndef test_stock_entry_pages_use_business_copy_and_preserve_stock_authority():\n\ttransfer = TRANSFER.read_text(encoding="utf-8")\n\tadjustment = ADJUSTMENT.read_text(encoding="utf-8")\n\n\tfor marker in (\n\t\t"The Stock Entry has been submitted and the stock movement is posted.",\n\t\t"The Stock Entry draft now owns the transfer.",\n\t\t"advanced Stock Entry review",\n\t\t"Stock Entry draft is saved",\n\t\t"Advanced: Open Stock Entry",\n\t\t"advanced Stock Entry form",\n\t):\n\t\tassert marker in transfer\n\n\tfor marker in (\n\t\t"The Stock Reconciliation has been submitted and the stock correction is posted.",\n\t\t"The Stock Reconciliation draft now owns this stock count.",\n\t\t"advanced Stock Reconciliation review",\n\t\t"Stock Reconciliation draft is saved",\n\t\t"Advanced: Open Stock Reconciliation",\n\t\t"advanced Stock Reconciliation form",\n\t):\n\t\tassert marker in adjustment\n\n\tfor text in (transfer, adjustment):\n\t\tfor forbidden in ("ERPNext", "Frappe Workflow", "Advanced: ERPNext"):\n\t\t\tassert forbidden not in text\n\n\tfor marker in (\n\t\t"create_simple_stock_transfer_draft",\n\t\t"update_standard_stock_document_draft",\n\t\t"get_standard_stock_completion_preview",\n\t\t'v-if="canUseNativeDesk"',\n\t\t'@click="openAdvancedNative"',\n\t\t'frappe.set_route("Form", "Stock Entry", this.savedDocument.name)',\n\t\t'frappe.new_doc("Stock Entry", { purpose: "Material Transfer" })',\n\t\t"sameWarehouse()",\n\t\t"transferContextReady()",\n\t):\n\t\tassert marker in transfer\n\n\tfor marker in (\n\t\t"create_simple_stock_adjustment_draft",\n\t\t"update_standard_stock_document_draft",\n\t\t"get_standard_stock_completion_preview",\n\t\t'v-if="canUseNativeDesk"',\n\t\t'@click="openAdvancedNative"',\n\t\t'frappe.set_route("Form", "Stock Reconciliation", this.savedDocument.name)',\n\t\t'frappe.new_doc("Stock Reconciliation")',\n\t\t"resolveBranchWarehouse",\n\t):\n\t\tassert marker in adjustment\n''', encoding='utf-8')
          PY
      - name: Verify bounded diff
        shell: bash
        run: |
          git diff --check
          tracked="$(git diff --name-only)"
          untracked="$(git ls-files --others --exclude-standard)"
          printf 'tracked:\n%s\nuntracked:\n%s\n' "$tracked" "$untracked"
          test "$tracked" = "retailedge/public/js/stock_adjustment/StockAdjustment.vue
          retailedge/public/js/transfer_stock/TransferStock.vue"
          test "$untracked" = "retailedge/tests/test_stock_entry_production_copy.py"
      - name: Commit bounded stock-entry copy slice
        shell: bash
        run: |
          git config user.name "RetailEdge Copy Patch"
          git config user.email "actions@users.noreply.github.com"
          git add \
            retailedge/public/js/stock_adjustment/StockAdjustment.vue \
            retailedge/public/js/transfer_stock/TransferStock.vue \
            retailedge/tests/test_stock_entry_production_copy.py
          git commit -m "fix: productionize stock entry copy"
          git push origin HEAD:fix/stock-entry-production-copy-20261008
