name: E15 Stale Test Contract Fix

on:
  push:
    branches:
      - agent/multi-app-coexistence-hardening

permissions:
  contents: write

jobs:
  patch-stale-label-contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/multi-app-coexistence-hardening
          fetch-depth: 0
      - name: Replace stale branch label assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('retailedge/tests/_cashier_expense_regression_suite.py')
          source = path.read_text(encoding='utf-8')
          old = 'self.assertEqual(by_fieldname["retailedge_branch"].get("label"), "RetailEdge Branch")'
          new = 'self.assertEqual(by_fieldname["retailedge_branch"].get("label"), "Operating Branch")'
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one stale label assertion, found {count}')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
      - name: Commit exact test-contract correction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add retailedge/tests/_cashier_expense_regression_suite.py
          git diff --cached --check
          git commit -m 'test(branch): expect neutral operating branch label'
          git push origin HEAD:agent/multi-app-coexistence-hardening
