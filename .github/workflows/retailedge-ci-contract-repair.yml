name: RetailEdge CI Contract Repair

on:
  push:
    branches:
      - feat/retailedge-edgesuite-ui-foundation

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/retailedge-edgesuite-ui-foundation
          fetch-depth: 0
      - name: Apply narrow CI contract repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new))

          cashier = "retailedge/tests/test_cashier_expense.py"
          replace(cashier, '"Audit Variance",\n\t\t\t"Payment Issues",', '"Absolute Audit Variance",\n\t\t\t"Payment Issues",')
          replace(cashier, '"POS Opening Shift",\n\t\t\t"POS Closing Shift",', '"POS Opening Entry",\n\t\t\t"POS Closing Entry",')
          replace(
              cashier,
              '@patch("retailedge.branch_context.validate_user_branch_access",\n\t\treturn_value={"allowed": True, "reason": "allowed_branch"},\n\t)\n\t@patch("retailedge.branch_context.resolve_retailedge_branch_context")\n\tdef test_apply_branch_context_to_doc_sets_branch_when_empty(self, mock_resolve, _mock_access):',
              '@patch("retailedge.branch_context.validate_user_branch_access",\n\t\treturn_value={"allowed": True, "reason": "allowed_branch"},\n\t)\n\t@patch("retailedge.branch_context.resolve_retailedge_branch_context")\n\t@patch("retailedge.branch_context.has_field", return_value=True)\n\tdef test_apply_branch_context_to_doc_sets_branch_when_empty(self, _mock_has_field, mock_resolve, _mock_access):',
          )
          replace(
              cashier,
              '\tdef test_get_branch_query_filters_returns_explicit_branch_filter(self):\n\t\tresult = get_branch_query_filters("RetailEdge Cashier Expense", branch="HQ")',
              '\t@patch("retailedge.branch_context.get_first_existing_field", return_value="branch")\n\tdef test_get_branch_query_filters_returns_explicit_branch_filter(self, _mock_branch_field):\n\t\tresult = get_branch_query_filters("RetailEdge Cashier Expense", branch="HQ")',
          )

          salesperson = "retailedge/tests/test_salesperson_performance.py"
          replace(salesperson, 'content.find("requireAsset(\'edgeui.bundle.js\'")', 'content.find("requireAsync(\'edgeui.bundle.js\'")')
          replace(salesperson, 'content.find("requireAsset(\'salesperson_performance.bundle.js\'")', 'content.find("requireAsync(\'salesperson_performance.bundle.js\'")')
          replace(salesperson, 'self.assertIn("requireAsset", content)', 'self.assertIn("requireAsync", content)')

          handoff = "retailedge/tests/test_edgepay_handoff_consumer.py"
          replace(
              handoff,
              '\t\tfor path in app_root.rglob("*.py"):\n\t\t\tcontent = path.read_text(encoding="utf-8")',
              '\t\tfor path in app_root.rglob("*.py"):\n\t\t\trelative_path = path.relative_to(app_root)\n\t\t\tif "tests" in relative_path.parts:\n\t\t\t\tcontinue\n\t\t\tcontent = path.read_text(encoding="utf-8")',
          )
          replace(handoff, 'violations.append(str(path.relative_to(app_root)))', 'violations.append(str(relative_path))')

          review_test = "retailedge/tests/test_edgepay_bank_match_review.py"
          replace(review_test, '"No linked Payment Entry"', '"No linked RetailEdge Payment Entry"')
          PY

          python -m compileall -q retailedge/tests
          git diff --check
      - name: Commit repairs
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No repair changes required"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add retailedge/tests
          git commit -m "test(retailedge): align standalone runtime contracts"
          git push origin HEAD:feat/retailedge-edgesuite-ui-foundation

# One-shot repair workflow; remove after the repair commit lands.
