name: EdgeSuite UI Candidate Compatibility

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: retailedge-edgeui-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compatibility:
    name: RetailEdge + reconciled EdgeSuite UI
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out RetailEdge QA candidate
        uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          check-latest: true

      - name: Install bench prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libmariadb-dev pkg-config redis-tools
          python -m pip install --upgrade frappe-bench
          redis-cli -h 127.0.0.1 -p 6379 ping

      - name: Create clean Frappe v16 bench
        run: |
          bench init \
            --frappe-branch version-16 \
            --python "$(command -v python)" \
            --skip-assets \
            --skip-redis-config-generation \
            frappe-bench
          cd frappe-bench
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache redis://127.0.0.1:6379
          bench set-config -g redis_queue redis://127.0.0.1:6379
          bench set-config -g redis_socketio redis://127.0.0.1:6379

      - name: Check out exact governed EdgeSuite UI 1.1.0 candidate
        uses: actions/checkout@v6
        with:
          repository: olayemigod/processedge-edge-suite-ui
          ref: e40ea4d7dc000d17443a0571c1e246b61bfd3e1d
          token: ${{ secrets.EDGESUITE_UI_TOKEN }}
          path: edgesuite-ui-source

      - name: Fetch ERPNext, Payments, EdgeSuite UI, and RetailEdge
        working-directory: frappe-bench
        run: |
          bench get-app --branch version-16 --skip-assets https://github.com/frappe/erpnext.git
          bench get-app --branch develop --skip-assets https://github.com/frappe/payments.git
          bench get-app --skip-assets "$GITHUB_WORKSPACE/edgesuite-ui-source"
          bench get-app --skip-assets "$GITHUB_WORKSPACE"

      - name: Build, migrate, and verify shared runtime
        working-directory: frappe-bench
        run: |
          test "$(git -C apps/edgesuite_ui rev-parse HEAD)" = "e40ea4d7dc000d17443a0571c1e246b61bfd3e1d"
          grep -Eq '^__version__ = "1\.1\.0"$' apps/edgesuite_ui/edgesuite_ui/__init__.py

          # RIR2C1: keyboard commands are owned by the governed shared EdgeSuite UI runtime.
          # RetailEdge must not revive its historical duplicate global listener.
          test -f apps/edgesuite_ui/edgesuite_ui/public/js/edgeui_ctrl_k_guard.js
          test -f apps/edgesuite_ui/edgesuite_ui/public/js/edgeui_ctrl_s_guard.js
          grep -Fq '/assets/edgesuite_ui/js/edgeui_ctrl_k_guard.js' apps/edgesuite_ui/edgesuite_ui/hooks.py
          grep -Fq '/assets/edgesuite_ui/js/edgeui_ctrl_s_guard.js' apps/edgesuite_ui/edgesuite_ui/hooks.py
          grep -Fq 'openProductMenu' apps/edgesuite_ui/edgesuite_ui/public/js/edgeui_ctrl_k_guard.js
          grep -Fq '.edge-product-menu__search' apps/edgesuite_ui/edgesuite_ui/public/js/edgeui_ctrl_k_guard.js
          grep -Fq 'form.doc.docstatus' apps/edgesuite_ui/edgesuite_ui/public/js/edgeui_ctrl_s_guard.js
          grep -Fq 'await form.save()' apps/edgesuite_ui/edgesuite_ui/public/js/edgeui_ctrl_s_guard.js
          grep -Fq 'saveCurrentContext' apps/edgesuite_ui/edgesuite_ui/public/js/edgeui_ctrl_s_guard.js
          grep -Fq 'registerSaveHandler' apps/edgesuite_ui/edgesuite_ui/public/js/edgeui/interaction_runtime.js
          grep -Fq 'edgesuite:save-request' apps/edgesuite_ui/edgesuite_ui/public/js/edgeui/interaction_runtime.js
          ! grep -Eq 'ignore_permissions|frappe\.db\.set_value|frappe\.client\.save|form\.doc\.docstatus[[:space:]]*=' \
            apps/edgesuite_ui/edgesuite_ui/public/js/edgeui_ctrl_s_guard.js \
            apps/edgesuite_ui/edgesuite_ui/public/js/edgeui/interaction_runtime.js

          bench build --app edgesuite_ui
          bench build --app retailedge
          python - <<'PY'
          import json
          from pathlib import Path

          assets = json.loads(Path("sites/assets/assets.json").read_text())
          required = (
              "retailedge_edgesuite_only_operational_guard.bundle.js",
              "professional_selling.bundle.js",
              "professional_purchasing.bundle.js",
          )
          missing = [bundle for bundle in required if bundle not in assets]
          if missing:
              raise SystemExit(f"RetailEdge bundles missing from assets.json: {missing}")
          PY
          bench --site retail-ci.localhost migrate
          grep -Eq 'EdgeReportShell' apps/edgesuite_ui/edgesuite_ui/public/js/edgeui/report_presentation.js
          test -f apps/edgesuite_ui/edgesuite_ui/search_ranking.py

      - name: Run full RetailEdge test suite
        working-directory: frappe-bench
        shell: bash
        run: |
          set -o pipefail
          bench --site retail-ci.localhost run-tests --app retailedge 2>&1 | tee /tmp/retailedge-edgeui-candidate-tests.log

      - name: Preserve failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: retailedge-edgeui-candidate-failure
          path: /tmp/retailedge-edgeui-candidate-tests.log
          if-no-files-found: ignore
          retention-days: 3
