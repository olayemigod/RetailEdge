name: R1 CI Contract Fixes

on:
  push:
    branches:
      - feat/retailedge-edgesuite-ui-foundation

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/retailedge-edgesuite-ui-foundation
          fetch-depth: 0

      - name: Align stale test contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=None):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if expected is not None and count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s), found {count}: {old!r}")
              if count == 0:
                  raise SystemExit(f"{path}: replacement target not found: {old!r}")
              p.write_text(text.replace(old, new))
              print(f"{path}: replaced {count} occurrence(s)")

          # Branch Performance intentionally renamed this summary metric to make
          # clear that aggregation uses absolute variance magnitude.
          replace(
              "retailedge/tests/test_branch_performance.py",
              '\t\t\t\t"Audit Variance",',
              '\t\t\t\t"Absolute Audit Variance",',
              expected=2,
          )

          # Static sidebar is ERPNext-safe. Runtime sync upgrades these two
          # targets to POSNext shifts when POSNext is installed.
          replace(
              "retailedge/tests/test_cashier_expense.py",
              '\t\t\t\t("Link", "POS Opening Shift", 1),\n\t\t\t\t("Link", "POS Closing Shift", 1),',
              '\t\t\t\t("Link", "POS Opening Entry", 1),\n\t\t\t\t("Link", "POS Closing Entry", 1),',
              expected=1,
          )

          # Branch-context tests use lightweight fake docs, so explicitly mock
          # the metadata checks now enforced by production code.
          replace(
              "retailedge/tests/test_cashier_expense.py",
              '@patch("retailedge.branch_context.resolve_retailedge_branch_context")\n\tdef test_apply_branch_context_to_doc_sets_branch_when_empty(self, mock_resolve, _mock_access):',
              '@patch("retailedge.branch_context.resolve_retailedge_branch_context")\n\t@patch("retailedge.branch_context.has_field", return_value=True)\n\tdef test_apply_branch_context_to_doc_sets_branch_when_empty(self, _mock_has_field, mock_resolve, _mock_access):',
              expected=1,
          )
          replace(
              "retailedge/tests/test_cashier_expense.py",
              '\tdef test_get_branch_query_filters_returns_explicit_branch_filter(self):\n\t\tresult = get_branch_query_filters("RetailEdge Cashier Expense", branch="HQ")',
              '\t@patch("retailedge.branch_context.get_first_existing_field", return_value="branch")\n\tdef test_get_branch_query_filters_returns_explicit_branch_filter(self, _mock_branch_field):\n\t\tresult = get_branch_query_filters("RetailEdge Cashier Expense", branch="HQ")',
              expected=1,
          )

          # Salesperson dashboard loader was migrated from callback-style
          # requireAsset to Promise-compatible requireAsync.
          replace(
              "retailedge/tests/test_salesperson_performance.py",
              'content.find("requireAsset(\'edgeui.bundle.js\'")',
              'content.find("requireAsync(\'edgeui.bundle.js\'")',
              expected=1,
          )
          replace(
              "retailedge/tests/test_salesperson_performance.py",
              'content.find("requireAsset(\'salesperson_performance.bundle.js\'")',
              'content.find("requireAsync(\'salesperson_performance.bundle.js\'")',
              expected=1,
          )
          replace(
              "retailedge/tests/test_salesperson_performance.py",
              'self.assertIn("requireAsset", content)',
              'self.assertIn("requireAsync", content)',
              expected=1,
          )

          # External-payment boundary test must scan production code, not
          # intentionally retained historical/contract test fixtures.
          replace(
              "retailedge/tests/test_edgepay_handoff_consumer.py",
              '\t\tfor path in app_root.rglob("*.py"):\n\t\t\tcontent = path.read_text(encoding="utf-8")\n\t\t\tif "from edgepayv1" in content or "import edgepayv1" in content:\n\t\t\t\tviolations.append(str(path.relative_to(app_root)))',
              '\t\tfor path in app_root.rglob("*.py"):\n\t\t\trelative_path = path.relative_to(app_root)\n\t\t\tif "tests" in relative_path.parts:\n\t\t\t\tcontinue\n\t\t\tcontent = path.read_text(encoding="utf-8")\n\t\t\tif "from edgepayv1" in content or "import edgepayv1" in content:\n\t\t\t\tviolations.append(str(relative_path))',
              expected=1,
          )

          replace(
              "retailedge/tests/test_edgepay_bank_match_review.py",
              'self.assertIn("No linked Payment Entry", res["message"])',
              'self.assertIn("No linked RetailEdge Payment Entry", res["message"])',
              expected=1,
          )
          PY

          rm -f .github/workflows/retailedge-ci-contract-repair.yml
          rm -f .github/workflows/r1-ci-contract-fixes.yml

          python -m compileall -q retailedge/tests
          git diff --check

      - name: Commit repairs
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(retailedge): align R1 standalone contracts"
          git push origin HEAD:feat/retailedge-edgesuite-ui-foundation
