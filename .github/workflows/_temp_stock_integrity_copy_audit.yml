name: Temporary stock integrity copy patch

on:
  push:
    branches:
      - fix/stock-accounting-integrity-production-copy-20261008
    paths:
      - .github/workflows/_temp_stock_integrity_copy_audit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/stock-accounting-integrity-production-copy-20261008
          fetch-depth: 0
      - name: Apply exact Stock and Accounting Integrity copy replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          component = Path('retailedge/public/js/stock_accounting_integrity/StockAccountingIntegrityReport.vue')
          text = component.read_text(encoding='utf-8')
          replacements = {
              'subtitle="Read-only ERPNext stock-versus-accounting exceptions. Values and mismatch logic come from the native Stock and Account Value Comparison report."': 'subtitle="Read-only stock-versus-accounting exceptions. Values and mismatch logic come from the Stock and Account Value Comparison report."',
              'emptyDescription="ERPNext returned no stock-versus-accounting exceptions for this Company, Stock Account, and date range."': 'emptyDescription="No stock-versus-accounting exceptions were found for this Company, Stock Account, and date range."',
              'loadingMessage="Checking ERPNext stock and accounting integrity…"': 'loadingMessage="Checking stock and accounting integrity…"',
              ":title=\"canUseNativeDesk ? 'Open ERPNext Stock and Account Value Comparison' : 'Advanced workflow: Native Desk access is required'\"": ":title=\"canUseNativeDesk ? 'Open Stock and Account Value Comparison' : 'Advanced workflow access is required'\"",
              '{{ canUseNativeDesk ? "Open ERPNext Advanced Report" : "Advanced: ERPNext Report" }}': '{{ canUseNativeDesk ? "Open Advanced Report" : "Advanced Report" }}',
              '{{ scan.mismatch_rows }} ERPNext exception row{{ scan.mismatch_rows === 1 ? "" : "s" }}': '{{ scan.mismatch_rows }} exception row{{ scan.mismatch_rows === 1 ? "" : "s" }}',
              'Read-only review: corrections and reposting remain in authorised ERPNext workflows.': 'Read-only review: corrections and reposting remain in authorised accounting workflows.',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new)

          source_old = '{ label: "Source", value: "ERPNext Stock and Account Value Comparison" }'
          source_new = '{ label: "Source", value: "Stock and Account Value Comparison" }'
          if text.count(source_old) != 2:
              raise SystemExit(f'Expected exactly two source labels, found {text.count(source_old)}')
          text = text.replace(source_old, source_new)

          for forbidden in (
              'Read-only ERPNext stock-versus-accounting exceptions',
              'ERPNext returned no stock-versus-accounting exceptions',
              'Checking ERPNext stock and accounting integrity',
              'Open ERPNext Stock and Account Value Comparison',
              'Open ERPNext Advanced Report',
              'Advanced: ERPNext Report',
              'ERPNext exception row',
              'authorised ERPNext workflows',
              'ERPNext Stock and Account Value Comparison',
              'Native Desk access is required',
          ):
              if forbidden in text:
                  raise SystemExit(f'Rendered platform wording remains: {forbidden}')

          for contract in (
              'window.EdgeSuiteUI?.components',
              'window.EdgeSuiteReports?.getProvider?.(REPORT_PRODUCT, REPORT_KEY)',
              'canUseNativeDesk: false',
              'Boolean(navigation.access?.can_use_native_desk)',
              'if (!this.canUseNativeDesk || !this.canOpenNativeReport || !this.nativeReportName) return;',
              'frappe.set_route("query-report", this.nativeReportName)',
              'clickable: this.canUseNativeDesk && ["name", "voucher_no"].includes(column.fieldname)',
              'Company-wide accounting control',
              'Correction Mode", value: "Read-only here"',
          ):
              if contract not in text:
                  raise SystemExit(f'Safety contract missing: {contract}')
          component.write_text(text, encoding='utf-8')

          c22 = Path('retailedge/tests/test_c22_stock_accounting_integrity.py')
          c22_text = c22.read_text(encoding='utf-8')
          old = 'self.assertIn("Open ERPNext Advanced Report", component)'
          new = 'self.assertIn("Open Advanced Report", component)'
          if c22_text.count(old) != 1:
              raise SystemExit(f'Unexpected C22 assertion count: {c22_text.count(old)}')
          c22.write_text(c22_text.replace(old, new), encoding='utf-8')

          containment = Path('retailedge/tests/test_rir2g2g17_stock_accounting_integrity_native_detail_containment.py')
          containment_text = containment.read_text(encoding='utf-8')
          old = 'assert "Advanced: ERPNext Report" in source'
          new = 'assert "Advanced Report" in source'
          if containment_text.count(old) != 1:
              raise SystemExit(f'Unexpected native-containment assertion count: {containment_text.count(old)}')
          containment.write_text(containment_text.replace(old, new), encoding='utf-8')

          regression = Path('retailedge/tests/test_stock_accounting_integrity_production_copy.py')
          regression.write_text('''from __future__ import annotations\n\nfrom pathlib import Path\n\n\nROOT = Path(__file__).resolve().parents[1]\nCOMPONENT = ROOT / "public/js/stock_accounting_integrity/StockAccountingIntegrityReport.vue"\n\n\ndef test_stock_accounting_integrity_uses_business_copy_and_preserves_native_report_safety():\n\ttext = COMPONENT.read_text(encoding="utf-8")\n\n\tfor marker in (\n\t\t"Read-only stock-versus-accounting exceptions",\n\t\t"No stock-versus-accounting exceptions were found",\n\t\t"Checking stock and accounting integrity",\n\t\t"Open Stock and Account Value Comparison",\n\t\t"Open Advanced Report",\n\t\t"Advanced Report",\n\t\t"exception row",\n\t\t"authorised accounting workflows",\n\t\t"Stock and Account Value Comparison",\n\t):\n\t\tassert marker in text\n\n\tfor forbidden in (\n\t\t"Read-only ERPNext stock-versus-accounting exceptions",\n\t\t"ERPNext returned no stock-versus-accounting exceptions",\n\t\t"Checking ERPNext stock and accounting integrity",\n\t\t"Open ERPNext Stock and Account Value Comparison",\n\t\t"Open ERPNext Advanced Report",\n\t\t"Advanced: ERPNext Report",\n\t\t"ERPNext exception row",\n\t\t"authorised ERPNext workflows",\n\t\t"ERPNext Stock and Account Value Comparison",\n\t\t"Native Desk access is required",\n\t):\n\t\tassert forbidden not in text\n\n\tfor contract in (\n\t\t"window.EdgeSuiteUI?.components",\n\t\t"window.EdgeSuiteReports?.getProvider?.(REPORT_PRODUCT, REPORT_KEY)",\n\t\t"canUseNativeDesk: false",\n\t\t"Boolean(navigation.access?.can_use_native_desk)",\n\t\t"frappe.set_route(\\\"query-report\\\", this.nativeReportName)",\n\t\t"Company-wide accounting control",\n\t\t"Correction Mode\\\", value: \\\"Read-only here",\n\t):\n\t\tassert contract in text\n''', encoding='utf-8')
          PY
      - name: Verify bounded diff
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only)" = "retailedge/public/js/stock_accounting_integrity/StockAccountingIntegrityReport.vue
          retailedge/tests/test_c22_stock_accounting_integrity.py
          retailedge/tests/test_rir2g2g17_stock_accounting_integrity_native_detail_containment.py
          retailedge/tests/test_stock_accounting_integrity_production_copy.py"
      - name: Commit bounded Stock and Accounting Integrity copy slice
        shell: bash
        run: |
          git config user.name "RetailEdge Copy Patch"
          git config user.email "actions@users.noreply.github.com"
          git add retailedge/public/js/stock_accounting_integrity/StockAccountingIntegrityReport.vue retailedge/tests/test_c22_stock_accounting_integrity.py retailedge/tests/test_rir2g2g17_stock_accounting_integrity_native_detail_containment.py retailedge/tests/test_stock_accounting_integrity_production_copy.py
          git commit -m "fix: productionize Stock and Accounting Integrity copy"
          git push origin HEAD:fix/stock-accounting-integrity-production-copy-20261008
