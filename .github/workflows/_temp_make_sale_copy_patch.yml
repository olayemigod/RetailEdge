name: Temporary Make Sale copy patch

on:
  push:
    branches:
      - fix/make-sale-production-copy-20261008
    paths:
      - .github/workflows/_temp_make_sale_copy_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: fix/make-sale-production-copy-20261008
          fetch-depth: 0

      - name: Apply exact Make Sale copy replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("retailedge/public/js/make_sale/MakeSale.vue")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '"ERPNext has submitted the Sales Invoice. Continue with the next valid customer workflow or start another sale."',
                  '"The Sales Invoice has been submitted. Continue with the next valid customer workflow or start another sale."',
                  1,
              ),
              (
                  '"The ERPNext Sales Invoice draft now owns the saved work. You can complete it or start another sale."',
                  '"The Sales Invoice draft now owns the saved work. You can complete it or start another sale."',
                  1,
              ),
              (
                  'Approval and submission stay on this persistent page. Quick Sale only creates the ERPNext draft.',
                  'Approval and submission stay on this persistent page. Quick Sale only creates the Sales Invoice draft.',
                  1,
              ),
              ('"Frappe Workflow"', '"Approval Workflow"', 1),
              ('"ERPNext submission"', '"Submission controls"', 1),
              (
                  'Only actions currently permitted by Frappe Workflow are shown.',
                  'Only actions currently permitted by the active approval workflow are shown.',
                  1,
              ),
              (
                  "Submit uses ERPNext's normal Sales Invoice validation, accounting and stock posting rules.",
                  "Submit uses the normal Sales Invoice validation, accounting and stock posting rules.",
                  1,
              ),
              ('Advanced: ERPNext', 'Advanced: Open Sales Invoice', 2),
              (
                  'This browser session keeps a temporary recovery copy until the ERPNext draft is saved.',
                  'This browser session keeps a temporary recovery copy until the Sales Invoice draft is saved.',
                  1,
              ),
              (
                  'Complete the required fields, then save the ERPNext draft.',
                  'Complete the required fields, then save the Sales Invoice draft.',
                  1,
              ),
              ('erpnext_default: "ERPNext default"', 'erpnext_default: "Default Selling Price List"', 1),
              ('] [source] || "ERPNext pricing"', '] [source] || "Standard pricing"', 0),
              ('}[source] || "ERPNext pricing"', '}[source] || "Standard pricing"', 1),
              (
                  'Leave Make Sale? Unsaved changes are kept temporarily in this browser session, but no ERPNext draft has been created yet.',
                  'Leave Make Sale? Unsaved changes are kept temporarily in this browser session, but no Sales Invoice draft has been created yet.',
                  1,
              ),
              (
                  'Open the saved Sales Invoice in Advanced ERPNext? Unsaved page edits are not carried until you update the draft.',
                  'Open the saved Sales Invoice in the advanced form? Unsaved page edits are not carried until you update the draft.',
                  1,
              ),
              (
                  'Open the advanced ERPNext Sales Invoice form? Save this Make Sale draft first if you want the current page entries recorded in ERPNext.',
                  'Open the advanced Sales Invoice form? Save this Make Sale draft first if you want the current page entries recorded.',
                  1,
              ),
          ]

          for old, new, expected in replacements:
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f"Expected {expected} occurrence(s) of {old!r}, found {actual}")
              if expected:
                  text = text.replace(old, new)

          if "ERPNext" in text:
              raise SystemExit("Unexpected visible ERPNext wording remains in MakeSale.vue")
          if "Frappe Workflow" in text:
              raise SystemExit("Unexpected Frappe Workflow wording remains in MakeSale.vue")

          required_contracts = (
              'const PREVIEW_METHOD = "retailedge.standard_sales_invoice_completion.get_standard_sales_invoice_completion_preview";',
              'const SUBMIT_METHOD = "retailedge.standard_sales_invoice_completion.submit_standard_sales_invoice";',
              'const WORKFLOW_METHOD = "retailedge.standard_sales_invoice_completion.apply_standard_sales_invoice_workflow_action";',
              'v-if="canUseNativeDesk"',
              '@click="openAdvancedNative"',
              'savedDocument.workflow_readiness?.source === "frappe"',
          )
          for contract in required_contracts:
              if contract not in text:
                  raise SystemExit(f"Safety contract missing after copy patch: {contract}")

          path.write_text(text, encoding="utf-8")

          test_path = Path("retailedge/tests/test_make_sale_production_copy.py")
          test_path.write_text('''from __future__ import annotations\n\nfrom pathlib import Path\n\n\nROOT = Path(__file__).resolve().parents[1]\nMAKE_SALE = ROOT / "public/js/make_sale/MakeSale.vue"\n\n\ndef test_make_sale_uses_business_facing_copy_and_preserves_completion_authority():\n\ttext = MAKE_SALE.read_text(encoding="utf-8")\n\n\tfor contract in (\n\t\t"The Sales Invoice has been submitted.",\n\t\t"The Sales Invoice draft now owns the saved work.",\n\t\t"Quick Sale only creates the Sales Invoice draft.",\n\t\t"Approval Workflow",\n\t\t"Submission controls",\n\t\t"active approval workflow",\n\t\t"normal Sales Invoice validation, accounting and stock posting rules",\n\t\t"Advanced: Open Sales Invoice",\n\t\t"temporary recovery copy until the Sales Invoice draft is saved",\n\t\t"Default Selling Price List",\n\t\t"Standard pricing",\n\t):\n\t\tassert contract in text\n\n\tfor forbidden in (\n\t\t"ERPNext",\n\t\t"Frappe Workflow",\n\t\t"Advanced: ERPNext",\n\t):\n\t\tassert forbidden not in text\n\n\tfor contract in (\n\t\t"get_standard_sales_invoice_completion_preview",\n\t\t"submit_standard_sales_invoice",\n\t\t"apply_standard_sales_invoice_workflow_action",\n\t\t'savedDocument.workflow_readiness?.source === "frappe"',\n\t\t'v-if="canUseNativeDesk"',\n\t\t'@click="openAdvancedNative"',\n\t):\n\t\tassert contract in text\n''', encoding="utf-8")
          PY

      - name: Verify bounded diff
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = "retailedge/public/js/make_sale/MakeSale.vue
          retailedge/tests/test_make_sale_production_copy.py"

      - name: Commit feature changes
        shell: bash
        run: |
          git config user.name "RetailEdge Copy Patch"
          git config user.email "actions@users.noreply.github.com"
          git add retailedge/public/js/make_sale/MakeSale.vue retailedge/tests/test_make_sale_production_copy.py
          git commit -m "fix: productionize Make Sale copy"
          git push origin HEAD:fix/make-sale-production-copy-20261008
