name: Temporary bank matching copy patch

on:
  push:
    branches:
      - fix/bank-matching-production-copy-20261008
    paths:
      - .github/workflows/_temp_bank_matching_copy_audit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/bank-matching-production-copy-20261008
          fetch-depth: 0
      - name: Apply exact Bank Matching copy replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          enhancements = Path('retailedge/public/js/bank_matching_page_enhancements.js')
          text = enhancements.read_text(encoding='utf-8')
          replacements = {
              'Smart date requires the EdgeSuite Reporting Standard component.': 'Smart Date is unavailable. Refresh the page or contact your administrator.',
              'The ERPNext template download service is unavailable.': 'The bank statement template download service is unavailable.',
              'ERPNext did not create a Bank Statement Import draft.': 'The Bank Statement Import draft could not be created.',
              'ERPNext validated the statement preview. Review it before starting import.': 'The statement preview was validated. Review it before starting import.',
              'ERPNext is processing the statement import.': 'The statement import is being processed.',
              'Import started. Use Check Status to refresh the ERPNext import result.': 'Import started. Use Check Status to refresh the import result.',
              'ERPNext is importing Bank Transactions. Matching and reconciliation remain separate actions.': 'Bank Transactions are being imported. Matching and reconciliation remain separate actions.',
              'Unable to start the ERPNext bank statement import.': 'Unable to start the bank statement import.',
              'ERPNext validated the file. No preview rows were returned for display.': 'The file was validated. No preview rows were returned for display.',
              'Preview and import through ERPNext Banking without leaving Bank Matching.': 'Preview and import Bank Transactions without leaving Bank Matching.',
              "Optional reusable column mapping. Leave blank to use the Bank's current ERPNext mapping.": "Optional reusable column mapping. Leave blank to use the Bank Account's current mapping.",
              'EdgeSuite modal components are unavailable. Rebuild EdgeSuite UI assets before importing a bank statement.': 'Bank statement import controls are unavailable. Refresh the page or contact your administrator.',
              'Upload, preview, and import a statement through ERPNext Banking in an EdgeSuite modal.': 'Upload, preview, and import a statement without leaving Bank Matching.',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one enhancement phrase {old!r}, found {count}')
              text = text.replace(old, new)
          enhancements.write_text(text, encoding='utf-8')

          reconciliation = Path('retailedge/public/js/bank_matching_reconciliation.js')
          text = reconciliation.read_text(encoding='utf-8')
          replacements = {
              'This match is confirmed and approved. Reconcile it through ERPNext after a fresh safety check?': 'This match is confirmed and approved. Reconcile it after a fresh safety check?',
              'Reconciling through ERPNext...': 'Reconciling...',
              'Match bank inflows and outflows to valid ERPNext accounting events, then reconcile through ERPNext Banking.': 'Match bank inflows and outflows to valid accounting events, then complete reconciliation.',
              'EdgeSuite UI runtime is required for Bank Matching & Reconciliation.': 'The Bank Matching & Reconciliation interface is unavailable. Refresh the page or contact your administrator.',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one reconciliation phrase {old!r}, found {count}')
              text = text.replace(old, new)
          reconciliation.write_text(text, encoding='utf-8')

          # Guard the operational contracts that must remain untouched.
          enhancement_text = enhancements.read_text(encoding='utf-8')
          for marker in (
              'const PREVIEW_METHOD = "erpnext.accounts.doctype.bank_statement_import.bank_statement_import.get_preview_from_template"',
              'const START_IMPORT_METHOD = "erpnext.accounts.doctype.bank_statement_import.bank_statement_import.form_start_import"',
              'const IMPORT_STATUS_METHOD = "erpnext.accounts.doctype.bank_statement_import.bank_statement_import.get_import_status"',
              'const MT940_CONVERT_METHOD = "erpnext.accounts.doctype.bank_statement_import.bank_statement_import.convert_mt940_to_csv"',
              'global.EdgeSuiteUI || global.EdgeUI || null',
              'X-Frappe-CSRF-Token',
              'CREATE_IMPORT_METHOD',
              'TEMPLATE_APPLY_METHOD',
          ):
              if marker not in enhancement_text:
                  raise SystemExit(f'Import safety contract missing: {marker}')

          reconciliation_text = reconciliation.read_text(encoding='utf-8')
          for marker in (
              'retailedge.bank_candidate_engine.get_direction_aware_bank_candidates',
              'retailedge.bank_candidate_engine.prepare_direction_aware_bank_candidate',
              'retailedge.reconciliation_approval.get_reconciliation_approval_state',
              'retailedge.reconciliation_approval.approve_reconciliation_for_match',
              'retailedge.banking_operations.match_and_reconcile',
              'args: { match_name: matchName, confirm_match: 0, confirm_reconciliation: 1 }',
              'global.EdgeSuiteUI || global.EdgeUI || null',
              'state.direction = value;',
              'state.queue = value;',
          ):
              if marker not in reconciliation_text:
                  raise SystemExit(f'Reconciliation safety contract missing: {marker}')

          regression = Path('retailedge/tests/test_bank_matching_production_copy.py')
          regression.write_text('''from __future__ import annotations\n\nfrom pathlib import Path\n\n\nROOT = Path(__file__).resolve().parents[1]\nENHANCEMENTS = ROOT / "public/js/bank_matching_page_enhancements.js"\nRECONCILIATION = ROOT / "public/js/bank_matching_reconciliation.js"\n\n\ndef test_bank_matching_uses_business_copy_and_preserves_banking_workflows():\n\tenhancements = ENHANCEMENTS.read_text(encoding="utf-8")\n\treconciliation = RECONCILIATION.read_text(encoding="utf-8")\n\n\tfor marker in (\n\t\t"Smart Date is unavailable. Refresh the page or contact your administrator.",\n\t\t"The bank statement template download service is unavailable.",\n\t\t"The Bank Statement Import draft could not be created.",\n\t\t"The statement preview was validated. Review it before starting import.",\n\t\t"The statement import is being processed.",\n\t\t"Import started. Use Check Status to refresh the import result.",\n\t\t"Bank Transactions are being imported. Matching and reconciliation remain separate actions.",\n\t\t"Unable to start the bank statement import.",\n\t\t"The file was validated. No preview rows were returned for display.",\n\t\t"Preview and import Bank Transactions without leaving Bank Matching.",\n\t\t"Bank statement import controls are unavailable.",\n\t\t"Upload, preview, and import a statement without leaving Bank Matching.",\n\t):\n\t\tassert marker in enhancements\n\n\tfor forbidden in (\n\t\t"Smart date requires the EdgeSuite Reporting Standard component.",\n\t\t"The ERPNext template download service is unavailable.",\n\t\t"ERPNext did not create a Bank Statement Import draft.",\n\t\t"ERPNext validated the statement preview.",\n\t\t"ERPNext is processing the statement import.",\n\t\t"refresh the ERPNext import result",\n\t\t"ERPNext is importing Bank Transactions",\n\t\t"Unable to start the ERPNext bank statement import.",\n\t\t"ERPNext validated the file.",\n\t\t"through ERPNext Banking",\n\t\t"current ERPNext mapping",\n\t\t"EdgeSuite modal components are unavailable",\n\t\t"in an EdgeSuite modal",\n\t):\n\t\tassert forbidden not in enhancements\n\n\tfor marker in (\n\t\t"This match is confirmed and approved. Reconcile it after a fresh safety check?",\n\t\t"Reconciling...",\n\t\t"Match bank inflows and outflows to valid accounting events, then complete reconciliation.",\n\t\t"The Bank Matching & Reconciliation interface is unavailable.",\n\t):\n\t\tassert marker in reconciliation\n\n\tfor forbidden in (\n\t\t"Reconcile it through ERPNext",\n\t\t"Reconciling through ERPNext",\n\t\t"valid ERPNext accounting events",\n\t\t"reconcile through ERPNext Banking",\n\t\t"EdgeSuite UI runtime is required for Bank Matching & Reconciliation",\n\t):\n\t\tassert forbidden not in reconciliation\n\n\tfor marker in (\n\t\t"erpnext.accounts.doctype.bank_statement_import.bank_statement_import.get_preview_from_template",\n\t\t"erpnext.accounts.doctype.bank_statement_import.bank_statement_import.form_start_import",\n\t\t"X-Frappe-CSRF-Token",\n\t\t"global.EdgeSuiteUI || global.EdgeUI || null",\n\t):\n\t\tassert marker in enhancements\n\n\tfor marker in (\n\t\t"retailedge.bank_candidate_engine.get_direction_aware_bank_candidates",\n\t\t"retailedge.bank_candidate_engine.prepare_direction_aware_bank_candidate",\n\t\t"retailedge.reconciliation_approval.approve_reconciliation_for_match",\n\t\t"retailedge.banking_operations.match_and_reconcile",\n\t\t"confirm_match: 0, confirm_reconciliation: 1",\n\t\t"global.EdgeSuiteUI || global.EdgeUI || null",\n\t):\n\t\tassert marker in reconciliation\n''', encoding='utf-8')
          PY
      - name: Verify bounded diff and JavaScript syntax
        shell: bash
        run: |
          git diff --check
          node --check retailedge/public/js/bank_matching_page_enhancements.js
          node --check retailedge/public/js/bank_matching_reconciliation.js
          test "$(git diff --name-only)" = "retailedge/public/js/bank_matching_page_enhancements.js
          retailedge/public/js/bank_matching_reconciliation.js
          retailedge/tests/test_bank_matching_production_copy.py"
      - name: Commit bounded Bank Matching production copy slice
        shell: bash
        run: |
          git config user.name "RetailEdge Copy Patch"
          git config user.email "actions@users.noreply.github.com"
          git add retailedge/public/js/bank_matching_page_enhancements.js retailedge/public/js/bank_matching_reconciliation.js retailedge/tests/test_bank_matching_production_copy.py
          git commit -m "fix: productionize Bank Matching copy"
          git push origin HEAD:fix/bank-matching-production-copy-20261008
