name: Temporary Business Control production-copy patch

on:
  push:
    branches:
      - fix/business-control-production-copy-20261008
    paths:
      - .github/workflows/_temp_business_control_copy_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/business-control-production-copy-20261008
          fetch-depth: 0
      - name: Apply bounded Business Control production-copy replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('retailedge/public/js/business_control_center/BusinessControlCenter.vue'): [
                  (
                      'subtitle="One prioritised view of operational exceptions and management financial signals. ERPNext remains authoritative for accounting balances and submitted transactions."',
                      'subtitle="One prioritised view of operational exceptions and management financial signals. Accounting balances and submitted transactions remain governed by the underlying business records."',
                  ),
                  (
                      'description="Net-new R9 liquidity, profitability, budget and spend-governance signals. Receivables and payables remain owned by their existing Action Centre controls."',
                      'description="Liquidity, profitability, budget and spend-governance signals. Receivables and payables remain owned by their existing Action Centre controls."',
                  ),
                  (
                      'No separate R9 financial signals are visible for the current scope.',
                      'No separate financial signals are visible for the current scope.',
                  ),
                  (
                      'Resolve the underlying condition in its owning workflow or authoritative ERPNext record/report. Authorised advanced users can open retained ERPNext/Frappe drill-through in a new tab.',
                      'Resolve the underlying condition in its owning workflow or authoritative business record/report. Authorised advanced users can open permitted full-record or report drill-through in a new tab.',
                  ),
              ],
              Path('retailedge/business_control_center.py'): [
                  (
                      'R9 warnings reuse the Branch scope resolved by Action Centre; a blank client Branch cannot widen a branch-restricted user\'s scope.',
                      'Financial warnings reuse the Branch scope resolved by Action Centre; a blank client Branch cannot widen a branch-restricted user\'s scope.',
                  ),
                  (
                      'R9 financial intelligence is temporarily unavailable for this scope.',
                      'Financial intelligence is temporarily unavailable for this scope.',
                  ),
                  (
                      'Collections and Supplier Obligations remain owned by the existing Action Centre receivables/payables sources and are not duplicated from R9 early warning.',
                      'Collections and Supplier Obligations remain owned by the existing Action Centre receivables/payables sources and are not duplicated from financial early warning.',
                  ),
                  (
                      'R9-only warnings are read-only in the pure composition helper; the runtime endpoint decorates all visible items through the existing Action Follow Up store after permission-aware resolution.',
                      'Financial-only warnings are read-only in the pure composition helper; the runtime endpoint decorates all visible items through the existing Action Follow Up store after permission-aware resolution.',
                  ),
                  (
                      'Business Control Centre composes existing ERPNext/RetailEdge reporting and control engines; it does not create a ledger or mutate accounting documents.',
                      'Business Control Centre composes existing reporting and control engines; it does not create a ledger or mutate accounting documents.',
                  ),
                  (
                      'Liquidity and budget/spend payloads already computed by R9 early warning are exposed for presentation without triggering duplicate financial queries.',
                      'Liquidity and budget/spend payloads already computed by the financial warning engine are exposed for presentation without triggering duplicate financial queries.',
                  ),
              ],
              Path('retailedge/tests/test_business_control_center_ui.py'): [
                  (
                      'self.assertIn("authoritative ERPNext record/report", source)',
                      'self.assertIn("authoritative business record/report", source)',
                  ),
              ],
          }

          for path, pairs in replacements.items():
              source = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = source.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one occurrence of {old!r}, found {count}')
                  source = source.replace(old, new)
              path.write_text(source, encoding='utf-8')

          test_path = Path('retailedge/tests/test_business_control_center_ui.py')
          source = test_path.read_text(encoding='utf-8')
          marker = '\n\nif __name__ == "__main__":\n'
          addition = '''\n\tdef test_business_control_copy_hides_internal_release_and_platform_wording(self):\n\t\tpage = (APP_ROOT / "public" / "js" / "business_control_center" / "BusinessControlCenter.vue").read_text()\n\t\tbackend = (APP_ROOT / "business_control_center.py").read_text()\n\t\tself.assertIn("Liquidity, profitability, budget and spend-governance signals", page)\n\t\tself.assertIn("No separate financial signals are visible for the current scope", page)\n\t\tself.assertIn("authoritative business record/report", page)\n\t\tself.assertNotIn("Net-new R9", page)\n\t\tself.assertNotIn("No separate R9", page)\n\t\tself.assertNotIn("authoritative ERPNext record/report", page)\n\t\tself.assertNotIn("ERPNext/Frappe drill-through", page)\n\t\tself.assertIn("Financial intelligence is temporarily unavailable for this scope.", backend)\n\t\tself.assertNotIn("R9 financial intelligence is temporarily unavailable for this scope.", backend)\n'''
          if addition.strip() in source:
              raise SystemExit('copy regression test already present')
          if source.count(marker) != 1:
              raise SystemExit('test insertion marker is not unique')
          source = source.replace(marker, addition + marker)
          test_path.write_text(source, encoding='utf-8')
          PY
      - name: Verify bounded copy-only diff
        shell: bash
        run: |
          python -m py_compile retailedge/business_control_center.py retailedge/tests/test_business_control_center_ui.py
          python -m unittest retailedge.tests.test_business_control_center_ui
          python - <<'PY'
          from pathlib import Path
          page = Path('retailedge/public/js/business_control_center/BusinessControlCenter.vue').read_text(encoding='utf-8')
          backend = Path('retailedge/business_control_center.py').read_text(encoding='utf-8')
          assert 'item.source === "r9_early_warning"' in page
          assert 'require_owner_scope: item.source === "r9_early_warning" ? 1 : 0' in page
          assert '"source": "r9_early_warning"' in backend
          assert 'decorate_action_items' in backend
          assert 'get_control_early_warning' in backend
          assert 'Net-new R9' not in page
          assert 'No separate R9' not in page
          PY
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            "retailedge/business_control_center.py"
            "retailedge/public/js/business_control_center/BusinessControlCenter.vue"
            "retailedge/tests/test_business_control_center_ui.py"
          )
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq "${#expected[@]}"
          diff <(printf '%s\n' "${changed[@]}") <(printf '%s\n' "${expected[@]}" | sort)
      - name: Commit Business Control copy fix
        shell: bash
        run: |
          git config user.name "olayemigod"
          git config user.email "olayemigod@gmail.com"
          git add retailedge/business_control_center.py retailedge/public/js/business_control_center/BusinessControlCenter.vue retailedge/tests/test_business_control_center_ui.py
          git commit -m "fix: productionize Business Control Centre copy"
          git push origin HEAD:fix/business-control-production-copy-20261008
