name: Temporary Reports Centre production-copy patch

on:
  push:
    branches:
      - fix/reports-centre-production-copy-20261008
    paths:
      - .github/workflows/_temp_reports_centre_copy_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/reports-centre-production-copy-20261008
          fetch-depth: 0
      - name: Apply bounded Reports Centre copy replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          vue = Path('retailedge/public/js/reports_centre/ReportsCentre.vue')
          test = Path('retailedge/tests/test_reports_centre.py')
          source = vue.read_text(encoding='utf-8')
          replacements = [
              (
                  'Open operational and management views already governed by RetailEdge and ERPNext permissions. Reports Centre does not create a second reporting truth.',
                  'Open operational and management views already governed by your access permissions. Reports Centre does not create a second reporting truth.',
              ),
              ('ERPNext financial report', 'Detailed financial report'),
          ]
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, found {count}')
              source = source.replace(old, new)
          vue.write_text(source, encoding='utf-8')

          t = test.read_text(encoding='utf-8')
          old = '"ERPNext financial report",'
          new = '"Detailed financial report",'
          if t.count(old) != 1:
              raise SystemExit(f'expected one stale Reports Centre assertion, found {t.count(old)}')
          t = t.replace(old, new)
          anchor = '\tassert "fetch(" not in source\n'
          addition = '\tassert "RetailEdge and ERPNext permissions" not in source\n\tassert "ERPNext financial report" not in source\n'
          if addition.strip() not in t:
              if t.count(anchor) != 1:
                  raise SystemExit('Reports Centre assertion anchor is not unique')
              t = t.replace(anchor, addition + anchor)
          test.write_text(t, encoding='utf-8')
          PY
      - name: Verify bounded Reports Centre diff
        shell: bash
        run: |
          python -m py_compile retailedge/tests/test_reports_centre.py
          python - <<'PY'
          from pathlib import Path
          source = Path('retailedge/public/js/reports_centre/ReportsCentre.vue').read_text(encoding='utf-8')
          assert 'governed by your access permissions' in source
          assert 'Detailed financial report' in source
          assert 'RetailEdge and ERPNext permissions' not in source
          assert 'ERPNext financial report' not in source
          assert 'item.native_desk' in source
          assert 'canUseNativeDesk' in source
          assert 'retailedgeSetReportRouteHandoff' in source
          PY
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            "retailedge/public/js/reports_centre/ReportsCentre.vue"
            "retailedge/tests/test_reports_centre.py"
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          diff <(printf '%s\n' "${changed[@]}") <(printf '%s\n' "${expected[@]}" | sort)
      - name: Commit Reports Centre copy fix
        shell: bash
        run: |
          git config user.name "olayemigod"
          git config user.email "olayemigod@gmail.com"
          git add retailedge/public/js/reports_centre/ReportsCentre.vue retailedge/tests/test_reports_centre.py
          git commit -m "fix: productionize Reports Centre copy"
          git push origin HEAD:fix/reports-centre-production-copy-20261008
