name: Temporary Record Purchase copy patch

on:
  push:
    branches:
      - fix/record-purchase-production-copy-20261008
    paths:
      - .github/workflows/_temp_record_purchase_copy_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: fix/record-purchase-production-copy-20261008
          fetch-depth: 0

      - name: Apply exact Record Purchase copy replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          vue_path = Path("retailedge/public/js/record_purchase/RecordPurchase.vue")
          text = vue_path.read_text(encoding="utf-8")

          replacements = [
              (
                  "Choose the ERPNext purchase path first. Standard procurement follows Purchase Order → Purchase Receipt → Purchase Invoice → Payment; direct supplier invoices remain available for genuine direct purchases.",
                  "Choose the purchase path first. Standard procurement follows Purchase Order → Purchase Receipt → Purchase Invoice → Payment; direct supplier invoices remain available for genuine direct purchases.",
                  1,
              ),
              (
                  "RetailEdge follows ERPNext purchasing documents rather than treating every purchase as a Purchase Invoice.",
                  "RetailEdge follows the standard purchasing documents rather than treating every purchase as a Purchase Invoice.",
                  1,
              ),
              (
                  "For a genuine direct purchase where goods are physically received now. ERPNext Purchase Invoice will post stock when submitted.",
                  "For a genuine direct purchase where goods are physically received now. Submitting the Purchase Invoice records the received stock.",
                  1,
              ),
              (
                  "ERPNext has submitted the Purchase Invoice. Continue to supplier settlement, payables review or document output.",
                  "The Purchase Invoice has been submitted. Continue to supplier settlement, payables review or document output.",
                  1,
              ),
              (
                  "The ERPNext Purchase Invoice draft now owns the transaction.",
                  "The Purchase Invoice draft now owns the transaction.",
                  1,
              ),
              (
                  "Approval and submission stay on this persistent page. Quick Purchase only creates the ERPNext draft.",
                  "Approval and submission stay on this persistent page. Quick Purchase only creates the Purchase Invoice draft.",
                  1,
              ),
              ('"Frappe Workflow"', '"Approval Workflow"', 1),
              ('"ERPNext submission"', '"Submission controls"', 1),
              (
                  "Only actions currently permitted by Frappe Workflow are shown.",
                  "Only actions currently permitted by the active approval workflow are shown.",
                  1,
              ),
              (
                  "Submit uses ERPNext's normal Purchase Invoice validation, payable and stock posting rules.",
                  "Submit uses the normal Purchase Invoice validation, payable and stock posting rules.",
                  1,
              ),
              ("Advanced: ERPNext", "Advanced: Open Purchase Invoice", 2),
              (
                  "ERPNext will post the received stock when this Purchase Invoice is submitted. A Receiving Stock Location is required.",
                  "Submitting this Purchase Invoice records the received stock. A Receiving Stock Location is required.",
                  1,
              ),
              (
                  "A temporary browser-session recovery copy is retained until the ERPNext draft is saved.",
                  "A temporary browser-session recovery copy is retained until the Purchase Invoice draft is saved.",
                  1,
              ),
              (
                  'erpnext_default: "ERPNext default"',
                  'erpnext_default: "Default Buying Price List"',
                  1,
              ),
              ('}[source] || "ERPNext pricing"', '}[source] || "Standard pricing"', 1),
              (
                  "Open the saved Purchase Invoice in Advanced ERPNext? Unsaved page edits are not carried until you update the draft.",
                  "Open the saved Purchase Invoice in the advanced form? Unsaved page edits are not carried until you update the draft.",
                  1,
              ),
              (
                  "Open the advanced ERPNext Purchase Invoice form? Save this page first if you want the current entries recorded.",
                  "Open the advanced Purchase Invoice form? Save this page first if you want the current entries recorded.",
                  1,
              ),
          ]

          for old, new, expected in replacements:
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f"Expected {expected} occurrence(s) of {old!r}, found {actual}")
              text = text.replace(old, new)

          if "ERPNext" in text:
              remaining = [f"{i}: {line}" for i, line in enumerate(text.splitlines(), 1) if "ERPNext" in line]
              raise SystemExit("Unexpected visible ERPNext wording remains:\n" + "\n".join(remaining))
          if "Frappe Workflow" in text:
              raise SystemExit("Unexpected Frappe Workflow wording remains in RecordPurchase.vue")

          required_contracts = (
              'const CREATE_METHOD = "retailedge.guided_purchase_invoice.create_simple_purchase_invoice_draft";',
              'const UPDATE_METHOD = "retailedge.standard_purchase_invoice_completion.update_standard_purchase_invoice_draft";',
              'const PREVIEW_METHOD = "retailedge.standard_purchase_invoice_completion.get_standard_purchase_invoice_completion_preview";',
              'const SUBMIT_METHOD = "retailedge.standard_purchase_invoice_completion.submit_standard_purchase_invoice";',
              'const WORKFLOW_METHOD = "retailedge.standard_purchase_invoice_completion.apply_standard_purchase_invoice_workflow_action";',
              'savedDocument.workflow_readiness?.source === "frappe"',
              'v-if="canUseNativeDesk"',
              '@click="openAdvancedNative"',
              'erpnext_default: "Default Buying Price List"',
              'v-if="!editingSavedDraft" class="edge-button" type="button" @click="choosePurchaseType">Change Purchase Type</button>',
          )
          for contract in required_contracts:
              if contract not in text:
                  raise SystemExit(f"Safety contract missing after copy patch: {contract}")

          vue_path.write_text(text, encoding="utf-8")

          alignment_path = Path("retailedge/tests/test_purchase_workflow_alignment.py")
          alignment = alignment_path.read_text(encoding="utf-8")
          old_alignment = 'assert "ERPNext will post the received stock when this Purchase Invoice is submitted." in source'
          new_alignment = 'assert "Submitting this Purchase Invoice records the received stock." in source'
          if alignment.count(old_alignment) != 1:
              raise SystemExit("Unexpected purchase workflow alignment assertion count")
          alignment_path.write_text(alignment.replace(old_alignment, new_alignment), encoding="utf-8")

          hardening_path = Path("retailedge/tests/test_quick_entry_transaction_hardening.py")
          hardening = hardening_path.read_text(encoding="utf-8")
          old_hardening = "assert 'Stock mode is fixed after the ERPNext draft is created.' in purchase"
          new_hardening = "assert 'v-if=\"!editingSavedDraft\" class=\"edge-button\" type=\"button\" @click=\"choosePurchaseType\">Change Purchase Type</button>' in purchase"
          if hardening.count(old_hardening) != 1:
              raise SystemExit("Unexpected quick-entry stock-mode assertion count")
          hardening_path.write_text(hardening.replace(old_hardening, new_hardening), encoding="utf-8")

          test_path = Path("retailedge/tests/test_record_purchase_production_copy.py")
          test_path.write_text('''from __future__ import annotations\n\nfrom pathlib import Path\n\n\nROOT = Path(__file__).resolve().parents[1]\nRECORD_PURCHASE = ROOT / "public/js/record_purchase/RecordPurchase.vue"\n\n\ndef test_record_purchase_uses_business_facing_copy_and_preserves_purchase_invoice_authority():\n\ttext = RECORD_PURCHASE.read_text(encoding="utf-8")\n\n\tfor contract in (\n\t\t"Choose the purchase path first.",\n\t\t"standard purchasing documents",\n\t\t"Submitting the Purchase Invoice records the received stock.",\n\t\t"The Purchase Invoice has been submitted.",\n\t\t"The Purchase Invoice draft now owns the transaction.",\n\t\t"Quick Purchase only creates the Purchase Invoice draft.",\n\t\t"Approval Workflow",\n\t\t"Submission controls",\n\t\t"active approval workflow",\n\t\t"normal Purchase Invoice validation, payable and stock posting rules",\n\t\t"Advanced: Open Purchase Invoice",\n\t\t"temporary browser-session recovery copy is retained until the Purchase Invoice draft is saved",\n\t\t"Default Buying Price List",\n\t\t"Standard pricing",\n\t\t"advanced Purchase Invoice form",\n\t):\n\t\tassert contract in text\n\n\tfor forbidden in (\n\t\t"ERPNext",\n\t\t"Frappe Workflow",\n\t\t"Advanced: ERPNext",\n\t):\n\t\tassert forbidden not in text\n\n\tfor contract in (\n\t\t"create_simple_purchase_invoice_draft",\n\t\t"update_standard_purchase_invoice_draft",\n\t\t"get_standard_purchase_invoice_completion_preview",\n\t\t"submit_standard_purchase_invoice",\n\t\t"apply_standard_purchase_invoice_workflow_action",\n\t\t'savedDocument.workflow_readiness?.source === "frappe"',\n\t\t'v-if="canUseNativeDesk"',\n\t\t'@click="openAdvancedNative"',\n\t\t'erpnext_default: "Default Buying Price List"',\n\t\t'v-if="!editingSavedDraft" class="edge-button" type="button" @click="choosePurchaseType">Change Purchase Type</button>',\n\t):\n\t\tassert contract in text\n''', encoding="utf-8")
          PY

      - name: Verify bounded diff
        shell: bash
        run: |
          git diff --check
          tracked="$(git diff --name-only)"
          untracked="$(git ls-files --others --exclude-standard)"
          printf 'tracked:\n%s\nuntracked:\n%s\n' "$tracked" "$untracked"
          test "$tracked" = "retailedge/public/js/record_purchase/RecordPurchase.vue
          retailedge/tests/test_purchase_workflow_alignment.py
          retailedge/tests/test_quick_entry_transaction_hardening.py"
          test "$untracked" = "retailedge/tests/test_record_purchase_production_copy.py"

      - name: Commit feature changes
        shell: bash
        run: |
          git config user.name "RetailEdge Copy Patch"
          git config user.email "actions@users.noreply.github.com"
          git add \
            retailedge/public/js/record_purchase/RecordPurchase.vue \
            retailedge/tests/test_purchase_workflow_alignment.py \
            retailedge/tests/test_quick_entry_transaction_hardening.py \
            retailedge/tests/test_record_purchase_production_copy.py
          git commit -m "fix: productionize Record Purchase copy"
          git push origin HEAD:fix/record-purchase-production-copy-20261008
