name: PR 131 assertion hotfix

on:
  push:
    branches:
      - fix/cashier-expense-readiness-lifecycle-sync-20261005
    paths:
      - .github/workflows/pr131-assertion-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/cashier-expense-readiness-lifecycle-sync-20261005
          fetch-depth: 0

      - name: Apply exact stale-assertion correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("retailedge/tests/_cashier_expense_regression_suite.py")
          text = path.read_text()
          marker = "def test_approve_normalises_stale_submitted_docstatus("
          start = text.find(marker)
          if start < 0:
              raise SystemExit("Target regression test was not found")
          end = text.find("\n\t@patch(", start + len(marker))
          if end < 0:
              end = len(text)
          block = text[start:end]
          old = "mock_set_value.assert_called_once_with("
          if block.count(old) != 1:
              raise SystemExit(
                  f"Expected one stale assertion in target test; found {block.count(old)}"
              )
          replacement = "mock_set_value.assert_any_call("
          updated_block = block.replace(old, replacement, 1)
          updated = text[:start] + updated_block + text[end:]
          path.write_text(updated)
          PY
          rm .github/workflows/pr131-assertion-hotfix.yml

      - name: Commit one-line regression correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add retailedge/tests/_cashier_expense_regression_suite.py .github/workflows/pr131-assertion-hotfix.yml
          git diff --cached --check
          git commit -m "test(cashier-expense): allow lifecycle readiness persistence write"
          git push origin HEAD:fix/cashier-expense-readiness-lifecycle-sync-20261005
