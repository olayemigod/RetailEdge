name: CI

on:
  push:
    branches:
      - version-16
  pull_request:

concurrency:
  group: version-16-retailedge-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    name: Server

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check out EdgeSuite UI document foundation
        uses: actions/checkout@v6
        with:
          repository: olayemigod/processedge-edge-suite-ui
          ref: agent/edgeui-document-foundation
          token: ${{ secrets.EDGESUITE_UI_TOKEN }}
          path: edgesuite-ui-source

      - name: Resolve changed RetailEdge test modules
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          else
            base_sha="$PUSH_BASE_SHA"
            head_sha="$PUSH_HEAD_SHA"
          fi

          if [ -z "$base_sha" ] || printf '%s' "$base_sha" | grep -Eq '^0+$'; then
            base_sha="$(git rev-parse "$head_sha^")"
          fi

          mapfile -t test_files < <(
            git diff --name-only --diff-filter=ACMR "$base_sha" "$head_sha" \
              | grep '^retailedge/tests/test_.*\.py$' \
              | sort -u \
              || true
          )

          if [ "${#test_files[@]}" -eq 0 ]; then
            echo "Every RetailEdge pull request or direct version-16 push must include a changed test module."
            exit 1
          fi

          : > "$GITHUB_WORKSPACE/test-modules.txt"
          for file in "${test_files[@]}"; do
            module="${file%.py}"
            module="${module//\//.}"
            echo "$module" | tee -a "$GITHUB_WORKSPACE/test-modules.txt"
          done

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install MariaDB Client
        run: |
          sudo apt update
          sudo apt-get install mariadb-client

      - name: Setup
        run: |
          pip install frappe-bench
          bench init --frappe-branch version-16 --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench

      - name: Install ERPNext, EdgeSuite UI and RetailEdge
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app --branch version-16 erpnext https://github.com/frappe/erpnext
          bench get-app --skip-assets "file://$GITHUB_WORKSPACE/edgesuite-ui-source"
          bench get-app --skip-assets "file://$GITHUB_WORKSPACE"
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app erpnext
          bench --site test_site install-app edgesuite_ui
          bench --site test_site install-app retailedge
          bench build --app edgesuite_ui
          bench build --app retailedge
          bench --site test_site migrate
        env:
          CI: 'Yes'

      - name: Run changed RetailEdge test modules
        id: server_tests
        continue-on-error: true
        working-directory: /home/runner/frappe-bench
        run: |
          set -o pipefail
          bench --site test_site set-config allow_tests true
          while IFS= read -r module; do
            echo "Running $module"
            bench --site test_site run-tests --app retailedge --module "$module"
          done < "$GITHUB_WORKSPACE/test-modules.txt" 2>&1 | tee "$GITHUB_WORKSPACE/server-tests.log"
        env:
          TYPE: server

      - name: Upload server test diagnostics
        if: steps.server_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: server-test-diagnostics
          path: server-tests.log

      - name: Enforce server test result
        if: steps.server_tests.outcome == 'failure'
        run: exit 1
