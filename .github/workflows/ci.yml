name: CI

on:
  push:
    branches:
      - version-16
  pull_request:
  workflow_dispatch:

concurrency:
  group: version-16-retailedge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Frappe v16 standalone integration
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out RetailEdge
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          check-latest: true

      - name: Install bench prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libmariadb-dev pkg-config redis-tools
          python -m pip install --upgrade frappe-bench
          redis-cli -h 127.0.0.1 -p 6379 ping

      - name: Create clean Frappe v16 bench
        run: |
          bench init \
            --frappe-branch version-16 \
            --python "$(command -v python)" \
            --skip-assets \
            --skip-redis-config-generation \
            frappe-bench

          cd frappe-bench
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache redis://127.0.0.1:6379
          bench set-config -g redis_queue redis://127.0.0.1:6379
          bench set-config -g redis_socketio redis://127.0.0.1:6379

      - name: Check out standalone EdgeSuite UI
        uses: actions/checkout@v6
        with:
          repository: olayemigod/processedge-edge-suite-ui
          ref: agent/edgeui-theme-foundation
          token: ${{ secrets.EDGESUITE_UI_TOKEN }}
          path: edgesuite-ui-source

      - name: Fetch ERPNext, Payments, EdgeSuite UI, and RetailEdge
        working-directory: frappe-bench
        run: |
          bench get-app \
            --branch version-16 \
            --skip-assets \
            https://github.com/frappe/erpnext.git

          bench get-app \
            --branch develop \
            --skip-assets \
            https://github.com/frappe/payments.git

          bench get-app \
            --skip-assets \
            "$GITHUB_WORKSPACE/edgesuite-ui-source"

          bench get-app \
            --skip-assets \
            "$GITHUB_WORKSPACE"

      - name: Create standalone RetailEdge site
        working-directory: frappe-bench
        run: |
          bench new-site retail-ci.localhost \
            --db-host 127.0.0.1 \
            --mariadb-root-password root \
            --admin-password admin \
            --no-mariadb-socket

          bench --site retail-ci.localhost install-app payments
          bench --site retail-ci.localhost install-app erpnext
          bench --site retail-ci.localhost install-app edgesuite_ui
          bench --site retail-ci.localhost install-app retailedge
          bench --site retail-ci.localhost set-config allow_tests true

      - name: Verify standalone application set
        working-directory: frappe-bench
        run: |
          bench --site retail-ci.localhost list-apps | tee /tmp/installed-apps.txt

          grep -Eq '^frappe[[:space:]]' /tmp/installed-apps.txt
          grep -Eq '^payments[[:space:]]' /tmp/installed-apps.txt
          grep -Eq '^erpnext[[:space:]]' /tmp/installed-apps.txt
          grep -Eq '^edgesuite_ui[[:space:]]' /tmp/installed-apps.txt
          grep -Eq '^retailedge[[:space:]]' /tmp/installed-apps.txt

          if grep -Eq '^coreedge[[:space:]]' /tmp/installed-apps.txt; then
            echo "CoreEdge must not be installed in the standalone RetailEdge CI site."
            exit 1
          fi

      - name: Build shared and product assets
        working-directory: frappe-bench
        run: |
          bench build --app edgesuite_ui
          bench build --app retailedge
          bench --site retail-ci.localhost migrate

      - name: Verify EdgeSuite UI asset contract
        working-directory: frappe-bench
        run: |
          grep -Eq 'edgeui\.bundle' sites/assets/assets.json
          grep -Eq 'retailedge_business_hub\.bundle' sites/assets/assets.json
          grep -Eq 'retailedge_product_menu\.bundle' sites/assets/assets.json

      - name: Run RetailEdge tests
        working-directory: frappe-bench
        shell: bash
        run: |
          set -o pipefail
          if ! bench --site retail-ci.localhost run-tests --app retailedge 2>&1 | tee /tmp/retailedge-tests.log; then
            {
              echo "## RetailEdge test failure tail"
              echo
              echo '```text'
              tail -n 180 /tmp/retailedge-tests.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E '^(FAIL|ERROR):|Traceback|AssertionError|ImportError|TypeError|AttributeError|ModuleNotFoundError|FAILED|Ran [0-9]+ tests' /tmp/retailedge-tests.log \
              | tail -n 80 \
              | while IFS= read -r line; do
                  line="${line//'%'/'%25'}"
                  line="${line//$'\r'/'%0D'}"
                  line="${line//$'\n'/'%0A'}"
                  echo "::error title=RetailEdge test failure::${line}"
                done
            exit 1
          fi
        env:
          CI: "Yes"
