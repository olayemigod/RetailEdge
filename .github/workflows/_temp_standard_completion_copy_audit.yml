name: Temporary standard completion backend copy patch

on:
  push:
    branches:
      - fix/standard-completion-backend-copy-20261008
    paths:
      - .github/workflows/_temp_standard_completion_copy_audit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/standard-completion-backend-copy-20261008
          fetch-depth: 0
      - name: Apply bounded user-facing copy replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              source = path.read_text(encoding='utf-8')
              count = source.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s) of {old!r}, found {count}')
              path.write_text(source.replace(old, new), encoding='utf-8')

          delivery = Path('retailedge/standard_delivery_completion.py')
          for old, new in [
              ('Only draft Delivery Notes can use standard EdgeSuite completion.', 'Only draft Delivery Notes can use guided completion.'),
              ('Amended Delivery Notes require Advanced ERPNext review.', 'Amended Delivery Notes require advanced review.'),
              ('Delivery returns require Advanced ERPNext review.', 'Delivery returns require advanced review.'),
              ('Internal or inter-company delivery requires Advanced ERPNext review.', 'Internal or inter-company delivery requires advanced review.'),
              ('Product Bundle / packed-item delivery requires Advanced ERPNext review.', 'Product Bundle / packed-item delivery requires advanced review.'),
              ('Serial/Batch controlled delivery requires Advanced ERPNext review.', 'Serial/Batch controlled delivery requires advanced review.'),
              ('Delivery Note is controlled by active Workflow {0}. Use the available workflow action in EdgeSuite.', 'Delivery Note is controlled by active Workflow {0}. Use the available workflow action shown here.'),
              ('Frappe Workflow', 'configured workflow'),
              ('ERPNext did not submit Delivery Note {0}.', 'Delivery Note {0} was not submitted. Refresh and review the document before retrying.'),
              ('No active Frappe Workflow owns this Delivery Note.', 'No active workflow owns this Delivery Note.'),
          ]:
              replace_exact(delivery, old, new)

          stock = Path('retailedge/standard_stock_completion.py')
          for old, new, expected in [
              ('Use Advanced ERPNext after correcting Warehouse/Branch setup.', 'Use advanced review after correcting Warehouse/Branch setup.', 1),
              ('Only draft stock documents can use standard EdgeSuite completion.', 'Only draft stock documents can use guided completion.', 1),
              ('Amended stock documents require Advanced ERPNext review.', 'Amended stock documents require advanced review.', 1),
              ('Stock documents with more than {0} rows require Advanced ERPNext review.', 'Stock documents with more than {0} rows require advanced review.', 1),
              ('Item {0} uses Serial No or Batch tracking and requires Advanced ERPNext.', 'Item {0} uses Serial No or Batch tracking and requires advanced review.', 3),
              ('Standard EdgeSuite completion is blocked:\\n- {0}', 'Guided completion is blocked:\\n- {0}', 2),
              ('This {0} is controlled by an active Frappe Workflow. Use the available workflow action in EdgeSuite.', 'This {0} is controlled by an active workflow. Use the available workflow action shown here.', 1),
              ('ERPNext did not submit {0} {1}.', '{0} {1} was not submitted. Refresh and review the document before retrying.', 1),
              ('No active Frappe Workflow owns this {0}.', 'No active workflow owns this {0}.', 1),
          ]:
              replace_exact(stock, old, new, expected)

          sales = Path('retailedge/standard_sales_invoice_completion.py')
          for old, new in [
              ('Only draft Sales Invoices can use standard EdgeSuite completion.', 'Only draft Sales Invoices can use guided completion.'),
              ('Amended Sales Invoices require Advanced ERPNext review.', 'Amended Sales Invoices require advanced review.'),
              ('Sales Return completion requires an ERPNext Return / Credit Note draft linked to its source Sales Invoice.', 'Sales Return completion requires a Return / Credit Note draft linked to its source Sales Invoice.'),
              ('POS Sales Invoice completion requires Advanced ERPNext review.', 'POS Sales Invoice completion requires advanced review.'),
              ('Consolidated Sales Invoice completion requires Advanced ERPNext review.', 'Consolidated Sales Invoice completion requires advanced review.'),
              ('Internal or inter-company Sales Invoice requires Advanced ERPNext review.', 'Internal or inter-company Sales Invoice requires advanced review.'),
              ('Sales Invoice write-off requires Advanced ERPNext review.', 'Sales Invoice write-off requires advanced review.'),
              ('Automatic outstanding write-off requires Advanced ERPNext review.', 'Automatic outstanding write-off requires advanced review.'),
              ('Pre-allocated advances require Advanced ERPNext review.', 'Pre-allocated advances require advanced review.'),
              ('Automatic advance allocation requires Advanced ERPNext review.', 'Automatic advance allocation requires advanced review.'),
              ('Sales Return completion requires a mapped ERPNext Return / Credit Note draft.', 'Sales Return completion requires a mapped Return / Credit Note draft.'),
              ('ERPNext could not rebuild the canonical Sales Return mapping for validation.', 'The Sales Return mapping could not be rebuilt for validation.'),
              ('ERPNext canonical Sales Return linkage no longer matches this draft.', 'The source Sales Return linkage no longer matches this draft.'),
              ("Return / Credit Note Update Stock no longer matches ERPNext's canonical mapping.", 'Return / Credit Note Update Stock no longer matches the source Sales Return mapping.'),
              ("This Return / Credit Note no longer matches ERPNext's canonical remaining return quantities. Use Advanced ERPNext for a partial or customised return.", 'This Return / Credit Note no longer matches the remaining return quantities from the source invoice. Use advanced review for a partial or customised return.'),
              ('Product Bundle / packed-item stock posting requires Advanced ERPNext review.', 'Product Bundle / packed-item stock posting requires advanced review.'),
              ('Serial/Batch controlled stock-updating Sales Invoice requires Advanced ERPNext review.', 'Serial/Batch controlled stock-updating Sales Invoice requires advanced review.'),
              ('Sales Return quantities remain owned by ERPNext canonical return mapping.', 'Sales Return quantities must remain aligned with the source invoice return mapping.'),
              ('Use Advanced ERPNext to change the payment schedule safely.', 'Use advanced review to change the payment schedule safely.'),
              ('ERPNext did not persist the requested Posting Date. Refresh and try again.', 'The requested Posting Date was not saved. Refresh and try again.'),
              ('ERPNext recalculated the Due Date from Payment Terms. ', 'The Due Date was recalculated from Payment Terms. '),
              ('Use Advanced ERPNext to review the payment schedule.', 'Use advanced review to review the payment schedule.'),
              ('Sales Invoice is controlled by active Workflow {0}. Use the available workflow action in EdgeSuite.', 'Sales Invoice is controlled by active Workflow {0}. Use the available workflow action shown here.'),
              ('Frappe Workflow', 'configured workflow'),
              ('ERPNext did not submit Sales Invoice {0}.', 'Sales Invoice {0} was not submitted. Refresh and review the document before retrying.'),
              ('No active Frappe Workflow owns this Sales Invoice.', 'No active workflow owns this Sales Invoice.'),
          ]:
              replace_exact(sales, old, new)

          purchase = Path('retailedge/standard_purchase_invoice_completion.py')
          for old, new in [
              ('Only draft Purchase Invoices can use standard EdgeSuite completion.', 'Only draft Purchase Invoices can use guided completion.'),
              ('Amended Purchase Invoices require Advanced ERPNext review.', 'Amended Purchase Invoices require advanced review.'),
              ('Return / Supplier Debit Note completion requires Advanced ERPNext review.', 'Return / Supplier Debit Note completion requires advanced review.'),
              ('Internal or inter-company Purchase Invoice requires Advanced ERPNext review.', 'Internal or inter-company Purchase Invoice requires advanced review.'),
              ('Paid-at-source Purchase Invoice requires Advanced ERPNext review.', 'Paid-at-source Purchase Invoice requires advanced review.'),
              ('Opening Purchase Invoice requires Advanced ERPNext review.', 'Opening Purchase Invoice requires advanced review.'),
              ('Pre-allocated advances require Advanced ERPNext review.', 'Pre-allocated advances require advanced review.'),
              ('Automatic advance allocation requires Advanced ERPNext review.', 'Automatic advance allocation requires advanced review.'),
              ('Subcontracting Purchase Invoice requires Advanced ERPNext review.', 'Subcontracting Purchase Invoice requires advanced review.'),
              ('Professional Purchasing completion requires an ERPNext Purchase Order or Purchase Receipt source link.', 'Professional Purchasing completion requires a Purchase Order or Purchase Receipt source link.'),
              ('Serial/Batch controlled stock-updating Purchase Invoice requires Advanced ERPNext review.', 'Serial/Batch controlled stock-updating Purchase Invoice requires advanced review.'),
              ('Warehouse {0} is not mapped to an operational Branch; use Advanced ERPNext review.', 'Warehouse {0} is not mapped to an operational Branch; use advanced review after correcting Branch/Warehouse setup.'),
              ("Due Date is controlled by this invoice's Payment Terms schedule. Use Advanced ERPNext to change the payment schedule safely.", "Due Date is controlled by this invoice's Payment Terms schedule. Use advanced review to change the payment schedule safely."),
              ('Purchase Invoice is controlled by active Workflow {0}. Use the available workflow action in EdgeSuite.', 'Purchase Invoice is controlled by active Workflow {0}. Use the available workflow action shown here.'),
              ('Frappe Workflow', 'configured workflow'),
              ('ERPNext did not submit Purchase Invoice {0}.', 'Purchase Invoice {0} was not submitted. Refresh and review the document before retrying.'),
              ('No active Frappe Workflow owns this Purchase Invoice.', 'No active workflow owns this Purchase Invoice.'),
          ]:
              replace_exact(purchase, old, new)

          test_replacements = {
              Path('retailedge/tests/test_rir2g1c_standard_delivery_note_completion_contract.py'): [
                  ('"Advanced ERPNext",', '"advanced review",', 1),
              ],
              Path('retailedge/tests/test_mvp_standard_stock_completion_contract.py'): [
                  ("assert 'Amended stock documents require Advanced ERPNext review.' in source", "assert 'Amended stock documents require advanced review.' in source", 1),
                  ("assert 'Serial No or Batch tracking and requires Advanced ERPNext' in source", "assert 'Serial No or Batch tracking and requires advanced review' in source", 1),
                  ('"uses Serial No or Batch tracking and requires Advanced ERPNext",', '"uses Serial No or Batch tracking and requires advanced review",', 1),
              ],
              Path('retailedge/tests/test_rir2g1d_standard_sales_invoice_completion_contract.py'): [
                  ('"Advanced ERPNext",', '"advanced review",', 1),
                  ('"canonical remaining return quantities",', '"remaining return quantities from the source invoice",', 1),
                  ("'Sales Return quantities remain owned by ERPNext canonical return mapping.',", "'Sales Return quantities must remain aligned with the source invoice return mapping.',", 1),
              ],
              Path('retailedge/tests/test_rir2g2b_guided_purchase_invoice_completion_continuity.py'): [
                  ('"Advanced ERPNext",', '"advanced review",', 1),
                  ('"Serial/Batch controlled stock-updating Purchase Invoice requires Advanced ERPNext review",', '"Serial/Batch controlled stock-updating Purchase Invoice requires advanced review",', 1),
              ],
          }
          for path, replacements in test_replacements.items():
              for old, new, expected in replacements:
                  replace_exact(path, old, new, expected)

          regression = Path('retailedge/tests/test_standard_completion_backend_production_copy.py')
          regression.write_text('''from __future__ import annotations\n\nimport ast\nfrom pathlib import Path\n\n\nROOT = Path(__file__).resolve().parents[1]\nSERVICES = (\n    ROOT / "standard_delivery_completion.py",\n    ROOT / "standard_stock_completion.py",\n    ROOT / "standard_sales_invoice_completion.py",\n    ROOT / "standard_purchase_invoice_completion.py",\n)\nFORBIDDEN = ("ERPNext", "EdgeSuite", "Frappe", "Native Desk")\n\n\ndef _translated_messages(source: str) -> list[str]:\n    tree = ast.parse(source)\n    messages: list[str] = []\n    for node in ast.walk(tree):\n        if not isinstance(node, ast.Call) or not isinstance(node.func, ast.Name) or node.func.id != "_" or not node.args:\n            continue\n        value = node.args[0]\n        if isinstance(value, ast.Constant) and isinstance(value.value, str):\n            messages.append(value.value)\n    return messages\n\n\ndef test_standard_completion_user_messages_hide_platform_implementation_names():\n    for path in SERVICES:\n        source = path.read_text(encoding="utf-8")\n        messages = _translated_messages(source)\n        leaked = [message for message in messages if any(term in message for term in FORBIDDEN)]\n        assert not leaked, f"{path.name} leaked platform wording: {leaked}"\n\n\ndef test_standard_completion_safety_and_native_authority_contracts_remain_intact():\n    delivery = (ROOT / "standard_delivery_completion.py").read_text(encoding="utf-8")\n    stock = (ROOT / "standard_stock_completion.py").read_text(encoding="utf-8")\n    sales = (ROOT / "standard_sales_invoice_completion.py").read_text(encoding="utf-8")\n    purchase = (ROOT / "standard_purchase_invoice_completion.py").read_text(encoding="utf-8")\n\n    for source in (delivery, stock, sales, purchase):\n        assert "get_workflow_readiness" in source\n        assert "apply_document_workflow_action(" in source\n        assert "doc.submit()" in source\n        assert "frappe.has_permission" in source\n\n    assert "_validate_source_and_stock_context" in delivery\n    assert "_validate_warehouse_access" in stock\n    assert "erpnext_make_sales_return" in sales\n    assert "_validate_stock_context" in sales\n    assert "_completion_source_context" in purchase\n    assert "_validate_stock_context" in purchase\n\n    # Internal authority metadata and imports remain intentionally technical.\n    assert '"source_of_truth": "ERPNext"' in delivery\n    assert '"source_of_truth": f"ERPNext {doc.doctype}"' in stock\n    assert '"source_of_truth": "ERPNext"' in sales\n    assert '"source_of_truth": "ERPNext Purchase Invoice"' in purchase\n''', encoding='utf-8')
          PY
      - name: Verify bounded copy-only change and Python syntax
        shell: bash
        run: |
          python -m py_compile \
            retailedge/standard_delivery_completion.py \
            retailedge/standard_stock_completion.py \
            retailedge/standard_sales_invoice_completion.py \
            retailedge/standard_purchase_invoice_completion.py \
            retailedge/tests/test_standard_completion_backend_production_copy.py
          python - <<'PY'
          import ast
          from pathlib import Path
          files = [
              Path('retailedge/standard_delivery_completion.py'),
              Path('retailedge/standard_stock_completion.py'),
              Path('retailedge/standard_sales_invoice_completion.py'),
              Path('retailedge/standard_purchase_invoice_completion.py'),
          ]
          forbidden = ('ERPNext', 'EdgeSuite', 'Frappe', 'Native Desk')
          for path in files:
              tree = ast.parse(path.read_text(encoding='utf-8'))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Call) and isinstance(node.func, ast.Name) and node.func.id == '_' and node.args:
                      value = node.args[0]
                      if isinstance(value, ast.Constant) and isinstance(value.value, str):
                          leaked = [term for term in forbidden if term in value.value]
                          if leaked:
                              raise SystemExit(f'{path}: translated message still leaks {leaked}: {value.value}')
          PY
          python - <<'PY'
          import subprocess
          expected = {
              'retailedge/standard_delivery_completion.py',
              'retailedge/standard_stock_completion.py',
              'retailedge/standard_sales_invoice_completion.py',
              'retailedge/standard_purchase_invoice_completion.py',
              'retailedge/tests/test_rir2g1c_standard_delivery_note_completion_contract.py',
              'retailedge/tests/test_mvp_standard_stock_completion_contract.py',
              'retailedge/tests/test_rir2g1d_standard_sales_invoice_completion_contract.py',
              'retailedge/tests/test_rir2g2b_guided_purchase_invoice_completion_continuity.py',
          }
          tracked = set(filter(None, subprocess.check_output(['git', 'diff', '--name-only']).decode().splitlines()))
          if tracked != expected:
              raise SystemExit(f'unexpected tracked diff: {sorted(tracked)}')
          if not Path('retailedge/tests/test_standard_completion_backend_production_copy.py').exists():
              raise SystemExit('missing new regression test')
          PY
      - name: Commit bounded copy fix
        shell: bash
        run: |
          git config user.name "olayemigod"
          git config user.email "olayemigod@gmail.com"
          git add \
            retailedge/standard_delivery_completion.py \
            retailedge/standard_stock_completion.py \
            retailedge/standard_sales_invoice_completion.py \
            retailedge/standard_purchase_invoice_completion.py \
            retailedge/tests/test_rir2g1c_standard_delivery_note_completion_contract.py \
            retailedge/tests/test_mvp_standard_stock_completion_contract.py \
            retailedge/tests/test_rir2g1d_standard_sales_invoice_completion_contract.py \
            retailedge/tests/test_rir2g2b_guided_purchase_invoice_completion_continuity.py \
            retailedge/tests/test_standard_completion_backend_production_copy.py
          git commit -m "fix: productionize standard completion backend copy"
          git push origin HEAD:fix/standard-completion-backend-copy-20261008
