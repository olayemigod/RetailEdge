name: Temporary active bank matching copy audit

on:
  push:
    branches:
      - fix/bank-matching-production-copy-20261008
    paths:
      - .github/workflows/_temp_active_bank_matching_copy_audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/bank-matching-production-copy-20261008
          fetch-depth: 0
      - name: Inventory active banking workspace rendered platform wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('retailedge/public/js/bank_matching_edgesuite_workspace.js')
          source = path.read_text(encoding='utf-8')
          terms = ('ERPNext', 'EdgeSuite UI', 'Native Desk', 'Frappe', 'Advanced:')
          for lineno, line in enumerate(source.splitlines(), 1):
              if any(term in line for term in terms):
                  print(f'{lineno}: {line}')
          PY
          exit 1
