name: Repair Portable Path Imports

on:
  push:
    branches:
      - feat/retailedge-edgesuite-ui-foundation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/retailedge-edgesuite-ui-foundation
          fetch-depth: 0
      - name: Repair module-level pathlib imports
        run: |
          python - <<'PY'
          from pathlib import Path

          changed = []
          for path in sorted(Path('retailedge/tests').rglob('test_*.py')):
              source = path.read_text()
              marker = 'APP_ROOT = Path(__file__).resolve().parents[1]'
              if marker not in source:
                  continue
              prefix = source.split(marker, 1)[0]
              if 'from pathlib import Path' in prefix:
                  continue

              future = 'from __future__ import annotations\n'
              if future in source:
                  source = source.replace(future, future + '\nfrom pathlib import Path\n', 1)
              else:
                  source = 'from pathlib import Path\n\n' + source
              path.write_text(source)
              changed.append(str(path))

          print('Repaired files:')
          for item in changed:
              print(item)
          PY

          python - <<'PY'
          from pathlib import Path
          import py_compile

          for path in Path('retailedge/tests').rglob('test_*.py'):
              py_compile.compile(str(path), doraise=True)
          PY

          git diff --check

      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo 'No portable-path import repairs required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add retailedge/tests
          git commit -m 'test(retailedge): repair portable path imports'
          git push origin HEAD:feat/retailedge-edgesuite-ui-foundation
