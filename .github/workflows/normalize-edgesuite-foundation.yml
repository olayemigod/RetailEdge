name: Normalize EdgeSuite Foundation

on:
  push:
    branches:
      - feat/retailedge-edgesuite-ui-foundation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/retailedge-edgesuite-ui-foundation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: python -m pip install --upgrade pre-commit

      - name: Normalize machine-specific test paths
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          tests_root = Path("retailedge/tests")
          absolute_prefix = "/home/olayemigod/frappe-bench/apps/retailedge/retailedge/"
          changed = []

          for path in sorted(tests_root.rglob("test_*.py")):
              source = path.read_text()
              if absolute_prefix not in source:
                  continue

              if "from pathlib import Path" not in source:
                  marker = "from __future__ import annotations\n"
                  if marker in source:
                      source = source.replace(marker, marker + "\nfrom pathlib import Path\n", 1)
                  else:
                      source = "from pathlib import Path\n\n" + source

              pattern = re.compile(
                  r'([\"\'])' + re.escape(absolute_prefix) + r'([^\"\']+)\1'
              )
              source, count = pattern.subn(
                  lambda match: 'str(APP_ROOT / ' + repr(match.group(2)) + ')',
                  source,
              )
              if not count:
                  raise SystemExit(f"No portable replacements made in {path}")

              if "APP_ROOT = Path(__file__).resolve().parents[1]" not in source:
                  class_index = source.find("\nclass ")
                  def_index = source.find("\ndef ")
                  candidates = [index for index in (class_index, def_index) if index >= 0]
                  if not candidates:
                      raise SystemExit(f"Could not place APP_ROOT in {path}")
                  insert_at = min(candidates)
                  source = (
                      source[:insert_at]
                      + "\n\nAPP_ROOT = Path(__file__).resolve().parents[1]\n"
                      + source[insert_at:]
                  )

              path.write_text(source)
              changed.append(str(path))

          print("Portable test-path files:")
          for path in changed:
              print(path)
          PY

      - name: Remove frontend shadowing violations
        run: |
          python - <<'PY'
          from pathlib import Path

          controller_path = Path("retailedge/public/js/retailedge_business_hub_page.js")
          controller = controller_path.read_text()
          replacements = {
              '} catch (error) {\n\t\t\tloading.remove();\n\t\t\tconsole.error("[RetailEdge Business Hub] mount failed", error);\n\t\t\trenderFailure(target, error);':
              '} catch (mountError) {\n\t\t\tloading.remove();\n\t\t\tconsole.error("[RetailEdge Business Hub] mount failed", mountError);\n\t\t\trenderFailure(target, mountError);',
              '.catch((error) => {\n\t\t\t\tconsole.error("[RetailEdge Product Menu] boot failed", error);':
              '.catch((menuError) => {\n\t\t\t\tconsole.error("[RetailEdge Product Menu] boot failed", menuError);',
              '} catch (error) {\n\t\t\t\tconsole.warn("[RetailEdge Business Hub] previous app unmount failed", error);':
              '} catch (unmountError) {\n\t\t\t\tconsole.warn("[RetailEdge Business Hub] previous app unmount failed", unmountError);',
              'const fail = (error) => {\n\t\t\t\tcompleted = true;\n\t\t\t\tglobal.clearTimeout(timer);\n\t\t\t\treject(error);':
              'const fail = (assetError) => {\n\t\t\t\tcompleted = true;\n\t\t\t\tglobal.clearTimeout(timer);\n\t\t\t\treject(assetError);',
              '} catch (error) {\n\t\t\t\tfail(error);':
              '} catch (requireError) {\n\t\t\t\tfail(requireError);',
              'function renderFailure(target, error) {\n\t\tconst message = error && error.message ? error.message :':
              'function renderFailure(target, failure) {\n\t\tconst message = failure && failure.message ? failure.message :',
          }
          for old, new in replacements.items():
              if old in controller:
                  controller = controller.replace(old, new, 1)
          controller_path.write_text(controller)

          bridge_path = Path("retailedge/public/js/retailedge_business_hub_route_bridge.js")
          bridge = bridge_path.read_text()
          replacements = {
              'const node = global.document?.querySelector(selector);\n\t\t\tif (node) {':
              'const matchedNode = global.document?.querySelector(selector);\n\t\t\tif (matchedNode) {',
              '\t\t\t\treturn node;\n\t\t\t}':
              '\t\t\t\treturn matchedNode;\n\t\t\t}',
              '(node) => {\n\t\t\t\tconst style = global.getComputedStyle?.(node);\n\t\t\t\treturn node.isConnected':
              '(pageNode) => {\n\t\t\t\tconst style = global.getComputedStyle?.(pageNode);\n\t\t\t\treturn pageNode.isConnected',
          }
          for old, new in replacements.items():
              if old in bridge:
                  bridge = bridge.replace(old, new, 1)
          bridge_path.write_text(bridge)
          PY

      - name: Format portability and frontend repairs
        run: |
          mapfile -t portable_tests < <(grep -rl 'APP_ROOT = Path(__file__).resolve().parents\[1\]' retailedge/tests --include='test_*.py' || true)
          if [ "${#portable_tests[@]}" -gt 0 ]; then
            pre-commit run ruff --files "${portable_tests[@]}" || true
            pre-commit run ruff-format --files "${portable_tests[@]}" || true
            pre-commit run ruff --files "${portable_tests[@]}"
            pre-commit run ruff-format --files "${portable_tests[@]}"
          fi

          pre-commit run prettier --files \
            retailedge/public/js/retailedge_business_hub_page.js \
            retailedge/public/js/retailedge_business_hub_route_bridge.js \
            retailedge/public/js/retailedge_product_menu.bundle.js \
            retailedge/retailedge/page/retailedge_business_hub/retailedge_business_hub.js || true

          pre-commit run prettier --files \
            retailedge/public/js/retailedge_business_hub_page.js \
            retailedge/public/js/retailedge_business_hub_route_bridge.js \
            retailedge/public/js/retailedge_product_menu.bundle.js \
            retailedge/retailedge/page/retailedge_business_hub/retailedge_business_hub.js

      - name: Verify JavaScript lint and syntax
        run: |
          pre-commit run eslint --files \
            retailedge/public/js/retailedge_business_hub_page.js \
            retailedge/public/js/retailedge_business_hub_route_bridge.js \
            retailedge/public/js/retailedge_product_menu.bundle.js \
            retailedge/retailedge/page/retailedge_business_hub/retailedge_business_hub.js

          node --check retailedge/public/js/retailedge_business_hub_page.js
          node --check retailedge/public/js/retailedge_business_hub_route_bridge.js
          node --check retailedge/public/js/retailedge_product_menu.bundle.js
          node --check retailedge/retailedge/page/retailedge_business_hub/retailedge_business_hub.js
          git diff --check

      - name: Verify no local developer paths remain in tests
        run: |
          if grep -R '/home/olayemigod/frappe-bench/apps/retailedge' retailedge/tests --include='test_*.py'; then
            echo "Machine-specific RetailEdge test paths remain."
            exit 1
          fi

      - name: Commit normalized files
        run: |
          if git diff --quiet; then
            echo "No normalization changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add retailedge/tests retailedge/public/js retailedge/retailedge/page/retailedge_business_hub
          git commit -m "test(retailedge): finish portable CI paths"
          git push origin HEAD:feat/retailedge-edgesuite-ui-foundation
