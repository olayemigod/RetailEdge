name: Temporary current production copy audit

on:
  push:
    branches:
      - audit/current-production-copy-residual-20261008
    paths:
      - .github/workflows/_temp_current_production_copy_audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/current-production-copy-residual-20261008
          fetch-depth: 0
      - name: Inventory likely rendered production-copy leaks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('retailedge')
          terms = (
              'ERPNext', 'Frappe', 'EdgeSuite', 'CoreEdge', 'Native Desk',
              'R8', 'R9', 'R10', 'R11', 'R12', 'MVP', ' QA', 'SaaS',
              'canonical', 'source of truth', 'server-derived', 'dry run', 'migration'
          )
          skip_parts = {'tests', 'patches', '__pycache__'}
          skip_snippets = (
              'frappe.', 'erpnext.', 'EdgeSuiteUI', 'EdgeUI', 'canUseNativeDesk',
              'method:', 'import ', 'from ', 'source_of_truth', 'sourceOfTruth',
              'frappe_call', 'frappe.call', 'getattr(frappe', 'hasattr(frappe'
          )
          hits = []
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix not in {'.vue', '.js', '.py'}:
                  continue
              if any(part in skip_parts for part in path.parts):
                  continue
              try:
                  lines = path.read_text(encoding='utf-8').splitlines()
              except UnicodeDecodeError:
                  continue
              for lineno, line in enumerate(lines, 1):
                  stripped = line.strip()
                  if not any(term.lower() in line.lower() for term in terms):
                      continue
                  if stripped.startswith(('#', '//', '/*', '*', '"""', "'''")):
                      continue
                  if any(snippet in line for snippet in skip_snippets):
                      continue
                  if not any(q in line for q in ('"', "'", '`')):
                      continue
                  hits.append((str(path), lineno, stripped))

          for path, lineno, line in hits:
              print(f'{path}:{lineno}: {line}')
          print(f'LIKELY_RENDERED_HITS={len(hits)}')
          PY
          exit 1
