name: Temporary runtime fallback copy audit

on:
  push:
    branches:
      - fix/runtime-fallback-production-copy-20261008
    paths:
      - .github/workflows/_temp_runtime_fallback_copy_audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/runtime-fallback-production-copy-20261008
          fetch-depth: 0
      - name: Inventory runtime-start framework wording only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          roots = [Path('retailedge/public/js'), Path('retailedge/retailedge/page')]
          term = 'EdgeSuite UI runtime is unavailable'
          found = 0
          files = 0
          for root in roots:
              for path in sorted(root.rglob('*.js')):
                  source = path.read_text(encoding='utf-8', errors='ignore')
                  hits = [(lineno, line) for lineno, line in enumerate(source.splitlines(), 1) if term in line]
                  if not hits:
                      continue
                  files += 1
                  for lineno, line in hits:
                      print(f'{path}:{lineno}: {line}')
                      found += 1
          print(f'FILES={files}')
          print(f'TOTAL={found}')
          PY
          exit 1
