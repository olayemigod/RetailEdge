name: RetailEdge Pre-Reporting Hardening Patch Runner

on:
  push:
    branches:
      - qa/retailedge-prereporting-hardening-20260902

permissions:
  contents: write

jobs:
  apply-b1:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch with full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply B1 access-foundation patch to reconciled product branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "RetailEdge Pre-Reporting Hardening"
          git config user.email "retailedge-hardening@users.noreply.github.com"
          git fetch origin qa/retailedge-reconciled-20260902
          git checkout -B qa/retailedge-reconciled-20260902 origin/qa/retailedge-reconciled-20260902
          test "$(git rev-parse HEAD)" = "451eebac2e6aa5ada54727810391fb89ce4bba69"

          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("retailedge")
          backend_path = root / "edgesuite_ui.py"
          backend = backend_path.read_text()

          old = '''@frappe.whitelist()\ndef get_retailedge_business_hub_context() -> dict[str, Any]:\n\troles = set(frappe.get_roles(frappe.session.user))\n\ttarget_cache: dict[tuple[str, str], bool] = {}\n'''
          new = '''@frappe.whitelist()\ndef get_retailedge_business_hub_context() -> dict[str, Any]:\n\troles = set(frappe.get_roles(frappe.session.user))\n\taccess_context = _get_edgesuite_access_context()\n\ttarget_cache: dict[tuple[str, str], bool] = {}\n'''
          assert backend.count(old) == 1
          backend = backend.replace(old, new)

          old = '''\tquick_actions = _get_permitted_quick_actions(\n\t\troles=roles,\n\t\ttarget_cache=target_cache,\n\t\tpermission_cache=permission_cache,\n\t)\n\treturn {\n'''
          new = '''\tquick_actions = _get_permitted_quick_actions(\n\t\troles=roles,\n\t\ttarget_cache=target_cache,\n\t\tpermission_cache=permission_cache,\n\t\tnative_desk_enabled=bool(access_context.get("can_use_native_desk")),\n\t)\n\treturn {\n'''
          assert backend.count(old) == 1
          backend = backend.replace(old, new)

          old = '''\t\t"quick_actions": quick_actions,\n\t\t"context": {\n'''
          new = '''\t\t"quick_actions": quick_actions,\n\t\t"access": access_context,\n\t\t"context": {\n'''
          assert backend.count(old) == 1
          backend = backend.replace(old, new)

          old = '''\t\t\t"native_document_fallback_enabled": True,\n'''
          new = '''\t\t\t"native_document_fallback_enabled": bool(access_context.get("can_use_native_desk")),\n'''
          assert backend.count(old) == 1
          backend = backend.replace(old, new)

          anchor = '''\ndef _get_permitted_navigation_groups(\n'''
          helper = '''\ndef _get_edgesuite_access_context() -> dict[str, Any]:\n\t"""Read the shared interface-exposure mode without changing business authorization.\n\n\tOlder shared-runtime builds fail open to native Desk so a rolling deploy cannot\n\tlock existing System Users out. Frappe/ERPNext permissions remain authoritative.\n\t"""\n\ttry:\n\t\tfrom edgesuite_ui.access_control import get_access_context\n\texcept ImportError:\n\t\treturn {\n\t\t\t"mode": "native_desk",\n\t\t\t"restricted_to_edgesuite": False,\n\t\t\t"can_use_native_desk": True,\n\t\t\t"authorization_source": "frappe_permissions",\n\t\t}\n\treturn dict(get_access_context())\n\n\ndef _get_permitted_navigation_groups(\n'''
          assert backend.count(anchor) == 1
          backend = backend.replace(anchor, helper)

          old = '''def _get_permitted_quick_actions(*, roles=None, target_cache=None, permission_cache=None) -> list[dict[str, Any]]:\n'''
          new = '''def _get_permitted_quick_actions(\n\t*, roles=None, target_cache=None, permission_cache=None, native_desk_enabled: bool = True,\n) -> list[dict[str, Any]]:\n'''
          assert backend.count(old) == 1
          backend = backend.replace(old, new)

          old = '''\tfor action in QUICK_ACTIONS:\n\t\tdoctype = action["doctype"]\n\t\tif not _doctype_exists_cached(doctype, target_cache) or not _has_permission_cached(doctype, "create", permission_cache):\n'''
          new = '''\tfor action in QUICK_ACTIONS:\n\t\tdoctype = action["doctype"]\n\t\tif action.get("mode") == "native_fallback" and not native_desk_enabled:\n\t\t\tcontinue\n\t\tif not _doctype_exists_cached(doctype, target_cache) or not _has_permission_cached(doctype, "create", permission_cache):\n'''
          assert backend.count(old) == 1
          backend = backend.replace(old, new)

          old = '''\tif target_type == "Page":\n\t\treturn _target_exists_cached(target_type, target, target_cache)\n\treturn False\n\n\ndef _can_open_report_cached'''
          new = '''\tif target_type == "Page":\n\t\treturn _target_exists_cached(target_type, target, target_cache) and _can_open_page_cached(\n\t\t\ttarget, permission_cache\n\t\t)\n\treturn False\n\n\ndef _can_open_page_cached(page_name: str, cache: dict[tuple[str, str], bool]) -> bool:\n\tkey = (f"Page:{page_name}", "open")\n\tif key not in cache:\n\t\tcache[key] = _can_open_page(page_name)\n\treturn cache[key]\n\n\ndef _can_open_page(page_name: str) -> bool:\n\ttry:\n\t\tpage = frappe.get_doc("Page", page_name)\n\t\treturn bool(page.is_permitted())\n\texcept Exception:\n\t\treturn False\n\n\ndef _can_open_report_cached'''
          assert backend.count(old) == 1
          backend = backend.replace(old, new)
          backend_path.write_text(backend)

          hub_path = root / "public/js/retailedge_business_hub/RetailEdgeBusinessHub.vue"
          hub = hub_path.read_text()

          dialog_names = [
              "SimpleSalesInvoiceDialog",
              "SimplePaymentDialog",
              "SimpleCashDepositDialog",
              "SimpleCashTransferDialog",
              "SimplePurchaseInvoiceDialog",
              "SimpleCashierExpenseDialog",
              "SimpleStockTransferDialog",
              "SimpleStockAdjustmentDialog",
          ]
          for name in dialog_names:
              pattern = re.compile(rf'(<{name}\\n\\s*:open="[^"]+"\\n)')
              hub, count = pattern.subn(r'\1\t\t\t\t:nativeFallbackEnabled="nativeFallbackEnabled"\n', hub, count=1)
              assert count == 1, f"missing parent prop for {name}"

          old = '''\t\t\tfeatureFlags: {},\n\t\t};\n'''
          new = '''\t\t\tfeatureFlags: {},\n\t\t\taccessContext: { mode: "native_desk", restricted_to_edgesuite: false, can_use_native_desk: true },\n\t\t};\n'''
          assert hub.count(old) == 1
          hub = hub.replace(old, new)

          old = '''\t\tshellMenuItems() {\n'''
          new = '''\t\tnativeFallbackEnabled() {\n\t\t\treturn (\n\t\t\t\tthis.accessContext.can_use_native_desk !== false &&\n\t\t\t\tthis.featureFlags.native_document_fallback_enabled !== false\n\t\t\t);\n\t\t},\n\t\tshellMenuItems() {\n'''
          assert hub.count(old) == 1
          hub = hub.replace(old, new)

          old = '''\t\t\t\t\t\t\tdescription: item.description || "",\n\t\t\t\t\t\t\troute: this.routeForTarget(item),\n\t\t\t\t\t\t\ticon: item.icon || "list",\n\t\t\t\t\t\t\tsource: item,\n'''
          new = '''\t\t\t\t\t\t\tdescription: item.description || "",\n\t\t\t\t\t\t\troute: this.routeForTarget(item),\n\t\t\t\t\t\t\ticon: item.icon || "list",\n\t\t\t\t\t\t\tlink_type: item.target_type,\n\t\t\t\t\t\t\tlink_to: item.target,\n\t\t\t\t\t\t\tsource: item,\n'''
          assert hub.count(old) == 1
          hub = hub.replace(old, new)

          old = '''\t\t\tthis.featureFlags = data.feature_flags || {};\n\t\t\tif (!this.quickActions.length) this.createPickerOpen = false;\n'''
          new = '''\t\t\tthis.featureFlags = data.feature_flags || {};\n\t\t\tthis.accessContext = { ...this.accessContext, ...(data.access || {}) };\n\t\t\tif (!this.quickActions.length) this.createPickerOpen = false;\n'''
          assert hub.count(old) == 1
          hub = hub.replace(old, new)

          old = '''\t\t\tfrappe.new_doc(action.doctype);\n\t\t},\n\t\tnotifyGuidedDraftSaved'''
          new = '''\t\t\tif (!this.nativeFallbackEnabled) {\n\t\t\t\tfrappe.show_alert?.({\n\t\t\t\t\tmessage: "This account is limited to EdgeSuite operational pages.",\n\t\t\t\t\tindicator: "orange",\n\t\t\t\t});\n\t\t\t\treturn;\n\t\t\t}\n\t\t\tfrappe.new_doc(action.doctype);\n\t\t},\n\t\tnotifyGuidedDraftSaved'''
          assert hub.count(old) == 1
          hub = hub.replace(old, new)

          old = '''\t\t\tconst doctype = result.doctype || fallbackDoctype;\n\t\t\tfrappe.set_route("Form", doctype, result.name);\n\t\t\tfrappe.call({\n'''
          new = '''\t\t\tconst doctype = result.doctype || fallbackDoctype;\n\t\t\tif (this.nativeFallbackEnabled) {\n\t\t\t\tfrappe.set_route("Form", doctype, result.name);\n\t\t\t}\n\t\t\tfrappe.call({\n'''
          assert hub.count(old) == 1
          hub = hub.replace(old, new)
          hub_path.write_text(hub)

          dialog_files = [root / f"public/js/retailedge_business_hub/{name}.vue" for name in dialog_names]
          for path in dialog_files:
              text = path.read_text()
              open_prop = '\t\topen: { type: Boolean, default: false },\n'
              assert text.count(open_prop) == 1, f"open prop mismatch: {path}"
              text = text.replace(
                  open_prop,
                  open_prop + '\t\tnativeFallbackEnabled: { type: Boolean, default: true },\n',
                  1,
              )
              pattern = re.compile(
                  r'<button type="button" class="edge-button" :disabled="([^"]*)" @click="openFullForm">'
              )
              text, count = pattern.subn(
                  r'<button v-if="nativeFallbackEnabled" type="button" class="edge-button" :disabled="\1" @click="openFullForm">',
                  text,
                  count=1,
              )
              assert count == 1, f"Open Full Form button mismatch: {path}"
              path.write_text(text)

          test_path = root / "tests/test_prereporting_access_hardening.py"
          test_path.write_text('''from __future__ import annotations\n\nimport unittest\nfrom pathlib import Path\nfrom types import SimpleNamespace\nfrom unittest.mock import patch\n\nfrom retailedge import edgesuite_ui\n\nAPP_ROOT = Path(__file__).resolve().parents[1]\n\n\nclass RetailEdgePreReportingAccessHardeningTests(unittest.TestCase):\n\tdef test_page_navigation_uses_native_frappe_page_permission(self):\n\t\tpage = SimpleNamespace(is_permitted=lambda: False)\n\t\twith patch.object(edgesuite_ui.frappe, "get_doc", return_value=page) as get_doc:\n\t\t\tself.assertFalse(edgesuite_ui._can_open_page("restricted-page"))\n\t\tget_doc.assert_called_once_with("Page", "restricted-page")\n\n\tdef test_page_permission_failure_fails_closed(self):\n\t\twith patch.object(edgesuite_ui.frappe, "get_doc", side_effect=RuntimeError("no page")):\n\t\t\tself.assertFalse(edgesuite_ui._can_open_page("missing-page"))\n\n\tdef test_native_fallback_quick_action_is_hidden_for_edgesuite_only_users(self):\n\t\twith (\n\t\t\tpatch("retailedge.edgesuite_ui._doctype_exists_cached", return_value=True),\n\t\t\tpatch("retailedge.edgesuite_ui._has_permission_cached", return_value=True),\n\t\t\tpatch("retailedge.edgesuite_ui._cashier_deposit_available", return_value=True),\n\t\t):\n\t\t\tactions = edgesuite_ui._get_permitted_quick_actions(\n\t\t\t\troles={"System Manager"}, native_desk_enabled=False\n\t\t\t)\n\t\tself.assertNotIn("new-warranty-claim", {action["key"] for action in actions})\n\t\tself.assertTrue(actions)\n\t\tself.assertTrue(all(action["mode"] == "available" for action in actions))\n\n\tdef test_native_fallback_remains_available_for_native_desk_users(self):\n\t\twith (\n\t\t\tpatch("retailedge.edgesuite_ui._doctype_exists_cached", return_value=True),\n\t\t\tpatch("retailedge.edgesuite_ui._has_permission_cached", return_value=True),\n\t\t\tpatch("retailedge.edgesuite_ui._cashier_deposit_available", return_value=True),\n\t\t):\n\t\t\tactions = edgesuite_ui._get_permitted_quick_actions(\n\t\t\t\troles={"System Manager"}, native_desk_enabled=True\n\t\t\t)\n\t\tself.assertIn("new-warranty-claim", {action["key"] for action in actions})\n\n\tdef test_retailedge_roles_remain_system_user_roles(self):\n\t\troles = (APP_ROOT / "setup_roles.py").read_text()\n\t\tself.assertIn('"desk_access": 1', roles)\n\t\tself.assertNotIn('"desk_access": 0', roles)\n\n\tdef test_business_hub_preserves_native_link_type_for_shared_access_filter(self):\n\t\thub = (\n\t\t\tAPP_ROOT / "public/js/retailedge_business_hub/RetailEdgeBusinessHub.vue"\n\t\t).read_text()\n\t\tself.assertIn("link_type: item.target_type", hub)\n\t\tself.assertIn("link_to: item.target", hub)\n\t\tself.assertIn("data.access || {}", hub)\n\t\tself.assertIn("if (this.nativeFallbackEnabled)", hub)\n\n\tdef test_guided_dialogs_hide_full_form_fallback_when_native_desk_is_unavailable(self):\n\t\tfor name in (\n\t\t\t"SimpleSalesInvoiceDialog",\n\t\t\t"SimplePaymentDialog",\n\t\t\t"SimpleCashDepositDialog",\n\t\t\t"SimpleCashTransferDialog",\n\t\t\t"SimplePurchaseInvoiceDialog",\n\t\t\t"SimpleCashierExpenseDialog",\n\t\t\t"SimpleStockTransferDialog",\n\t\t\t"SimpleStockAdjustmentDialog",\n\t\t):\n\t\t\twith self.subTest(name=name):\n\t\t\t\tsource = (APP_ROOT / f"public/js/retailedge_business_hub/{name}.vue").read_text()\n\t\t\t\tself.assertIn("nativeFallbackEnabled: { type: Boolean, default: true }", source)\n\t\t\t\tself.assertIn('v-if="nativeFallbackEnabled"', source)\n\n\nif __name__ == "__main__":\n\tunittest.main()\n''')

          doc_path = Path("docs/prereporting_access_hardening.md")
          doc_path.write_text('''# RetailEdge Pre-Reporting Access Hardening\n\n## B1 — EdgeSuite-only access foundation\n\nThis checkpoint hardens RetailEdge's integration with the governed EdgeSuite UI 1.1.0 Desk Access Management contract before reporting work begins.\n\n### Access model\n\nRetailEdge operational roles intentionally retain Frappe `desk_access = 1`. EdgeSuite operational pages run inside Frappe Desk, so ordinary operators must remain valid **System Users**. The shared EdgeSuite UI app owns the separate per-user **EdgeSuite Desk Access** selector and resolves `native_desk`, `edgesuite_only`, or `website` interface modes.\n\nThe selector is presentation/interface exposure only. It does not grant or replace DocType permissions, Page permissions, Report permissions, User Permissions, Company/Branch scope, workflows, accounting authorization, stock authorization, or any product-specific backend validation.\n\n### RetailEdge changes\n\n- Business Hub Page targets now use Frappe v16 `Page.is_permitted()` before they are advertised.\n- The Business Hub context exposes the shared EdgeSuite access context and makes native-document fallback conditional on `can_use_native_desk`.\n- `native_fallback` quick actions are omitted for EdgeSuite-only users.\n- Business Hub shell items preserve `link_type` and `link_to`, allowing the shared EdgeSuite runtime to remove native DocType/Report/Workspace routes for restricted users.\n- Guided dialogs hide **Open Full Form** when native Desk is unavailable.\n- Guided draft saves remain in EdgeSuite for restricted users instead of routing them into a native ERPNext Form that the shared guard would immediately reject.\n- Native Desk users retain the existing full-form continuation and fallback behaviour.\n\n### Backward compatibility\n\nIf RetailEdge is briefly deployed with an older EdgeSuite UI build that does not expose the access-control module, Business Hub treats the interface as native-Desk-capable. This avoids a rolling-deploy lockout; Frappe/ERPNext business permissions remain authoritative. The governed compatibility workflow still pins and verifies the EdgeSuite UI 1.1.0 candidate.\n\n### Deliberately unchanged\n\n- RetailEdge role names and Role Profiles are not renamed or rewritten in B1.\n- Role-level `desk_access` is not disabled.\n- No ERPNext permission is broadened.\n- No submitted accounting, stock or payment document is mutated.\n- Company/Branch scoping rules are unchanged.\n- Full EdgeSuite replacement of every ordinary native workflow is a later pre-reporting hardening slice.\n\n### Required validation\n\n1. Page navigation follows native Frappe Page permission.\n2. EdgeSuite-only context hides native-only quick actions and full-form buttons.\n3. EdgeSuite-only guided saves stay on an EdgeSuite page.\n4. Native Desk users retain existing fallback behaviour.\n5. RetailEdge roles remain System-User-capable.\n6. Theme, linters, clean Frappe v16 full tests and governed EdgeSuite candidate compatibility pass on the exact B1 head.\n''')
          PY

          python -m compileall -q retailedge/retailedge/edgesuite_ui.py retailedge/retailedge/tests/test_prereporting_access_hardening.py
          grep -q 'link_type: item.target_type' retailedge/retailedge/public/js/retailedge_business_hub/RetailEdgeBusinessHub.vue
          grep -q 'page.is_permitted()' retailedge/retailedge/edgesuite_ui.py
          grep -q 'native_desk_enabled' retailedge/retailedge/edgesuite_ui.py
          test "$(grep -l 'v-if="nativeFallbackEnabled"' retailedge/retailedge/public/js/retailedge_business_hub/Simple*Dialog.vue | wc -l)" -eq 8
          grep -q '"desk_access": 1' retailedge/retailedge/setup_roles.py
          ! grep -q '"desk_access": 0' retailedge/retailedge/setup_roles.py

          git add retailedge/retailedge/edgesuite_ui.py \
            retailedge/retailedge/public/js/retailedge_business_hub \
            retailedge/retailedge/tests/test_prereporting_access_hardening.py \
            docs/prereporting_access_hardening.md
          git diff --cached --check
          git status --short
          git commit -m "fix(access): harden EdgeSuite-only RetailEdge navigation"
          git push origin HEAD:refs/heads/qa/retailedge-reconciled-20260902
          echo "b1_head=$(git rev-parse HEAD)"
