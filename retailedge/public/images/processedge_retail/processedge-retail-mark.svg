<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">ProcessEdge Retail Shelf R mark</title>
  <desc id="desc">A dimensional letter R built from shelf-like green and blue planes.</desc>
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39C875"/>
      <stop offset=".55" stop-color="#1C9C5D"/>
      <stop offset="1" stop-color="#087744"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16A4F2"/>
      <stop offset=".52" stop-color="#0056A6"/>
      <stop offset="1" stop-color="#003E73"/>
    </linearGradient>
    <linearGradient id="blue2" x1=".2" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#158DE2"/>
      <stop offset="1" stop-color="#003E73"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#E9EEF3"/>
      <stop offset="1" stop-color="#BCC9D4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#003E73" flood-opacity=".18"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <path d="M82 142 215 72v356L82 360Z" fill="url(#green)"/>
    <path d="M215 72 337 133c47 23 77 63 77 111 0 62-43 106-108 111l-62-34v-68l61 31c26-3 41-18 41-40 0-18-11-31-34-43l-97-49Z" fill="url(#blue)"/>
    <path d="M244 321 414 408v71L244 392Z" fill="url(#blue2)"/>
    <path d="M215 151 274 181v238l-59-31Z" fill="url(#silver)"/>
    <path d="M82 211 215 281" stroke="#fff" stroke-width="16" stroke-linecap="square" opacity=".96"/>
    <path d="M82 281 215 351" stroke="#fff" stroke-width="16" stroke-linecap="square" opacity=".96"/>
    <path d="M84 144 214 77" stroke="#8EE5B0" stroke-width="5" opacity=".55"/>
    <path d="M218 75 337 135" stroke="#66C8FF" stroke-width="5" opacity=".35"/>
  </g>
